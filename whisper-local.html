<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Whisper 手機內辨識測試 · 日語階梯</title>
<meta name="theme-color" content="#f6f2ea" />
<style>
  :root{--paper:#f6f2ea;--card:#fffdf8;--ink:#221e19;--ink2:#5d5549;--muted:#98907f;--line:#e5dccb;--shu:#b03a2e;
    --sans:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans CJK TC",sans-serif;--serif:"Hiragino Mincho ProN","Songti TC",serif}
  *{box-sizing:border-box}
  body{margin:0 auto;max-width:640px;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
    background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{margin:0 0 14px;font-size:13px;color:var(--ink2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
  .card h2{font-size:13px;margin:0 0 6px;color:var(--ink2);font-weight:500}
  .big{font-family:var(--serif);font-size:19px;line-height:1.6}
  .kana{font-size:12.5px;color:var(--muted)}
  .stage{font-size:15px;font-weight:500}
  .meter{height:6px;background:#ece3d2;border-radius:99px;overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;width:0;background:var(--shu);transition:width .3s}
  button{appearance:none;border:0;border-radius:999px;font-family:var(--sans);font-size:15px;padding:13px 22px;
    background:var(--shu);color:#fffdf8;width:100%;margin-bottom:9px}
  button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  button[disabled]{opacity:.45}
  pre{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px;
    white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;margin:0;max-height:240px;overflow:auto}
  .bad{color:var(--shu)}.ok{color:#3f7a4f}
  .hint{font-size:12px;color:var(--muted);line-height:1.8;margin:10px 0 0}
</style>
</head>
<body>
<h1>Whisper 手機內辨識測試</h1>
<p class="sub">模型在瀏覽器內執行，音訊不上傳。模型約 40MB，第一次要下載。</p>

<div class="card">
  <h2>現在這一步</h2>
  <div class="stage" id="stage">尚未開始</div>
  <div class="meter"><i id="bar"></i></div>
  <div class="kana" id="sub">按下方按鈕開始</div>
</div>

<div class="card">
  <h2>本句</h2>
  <div class="big" id="targetJa">載入中…</div>
  <div class="kana" id="targetKana"></div>
</div>

<button id="load">載入模型</button>
<button id="rec" class="sec" disabled>開始收音（載入後可用）</button>
<button id="stop" class="sec" disabled>停止並辨識</button>

<div class="card">
  <h2>辨識結果</h2>
  <div class="big" id="said">（未收音）</div>
  <div class="kana" id="score"></div>
</div>

<div class="card">
  <h2>記錄</h2>
  <pre id="log"></pre>
</div>

<p class="hint">
用 Safari 直接開啟（不要用加到主畫面的 App）。若某一步超過 90 秒沒動靜，請把「現在這一步」與記錄貼回。
</p>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

env.allowLocalModels = false;
if (env.backends && env.backends.onnx && env.backends.onnx.wasm) env.backends.onnx.wasm.numThreads = 1;

const el = {
  stage: document.getElementById('stage'),
  sub: document.getElementById('sub'),
  bar: document.getElementById('bar'),
  log: document.getElementById('log'),
  said: document.getElementById('said'),
  score: document.getElementById('score'),
  load: document.getElementById('load'),
  rec: document.getElementById('rec'),
  stop: document.getElementById('stop')
};
const lines = [], T0 = performance.now();
const now = () => ((performance.now() - T0) / 1000).toFixed(1) + 's';
function log(s){
  lines.push('[' + now() + '] ' + s);
  el.log.innerHTML = lines.slice(-30).map(l =>
    '<span class="' + (/失敗|錯誤|error/.test(l) ? 'bad' : /✓|完成|就緒/.test(l) ? 'ok' : '') + '">' +
    l.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</span>').join('\n');
  el.log.scrollTop = el.log.scrollHeight;
}
function stage(t, s, p){
  el.stage.textContent = t;
  if (s != null) el.sub.textContent = s;
  if (p != null) el.bar.style.width = Math.max(0, Math.min(100, p)) + '%';
}

const qs = new URLSearchParams(location.search);
const DI = parseInt(qs.get('d') || '0', 10), LI = parseInt(qs.get('l') || '0', 10);
let target = { ja:'あのう、初めまして。李です。', kana:'あのう、はじめまして。りです。' };
document.getElementById('targetJa').textContent = target.ja;

const toHira = s => String(s).replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const clean = s => toHira(s || '').replace(/[\s\u3000]/g, '').replace(/[、。，．,.！!？?「」『』（）()・…~～ー―-]/g, '');
function lcsScore(t, heard){
  const a = clean(t).split(''), b = clean(heard).split('');
  if (!a.length || !b.length) return 0;
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  return Math.round(dp[a.length][b.length] / a.length * 100);
}

fetch('data/lesson-L01.json').then(r => r.json()).then(l => {
  const line = l.dialogues[DI].lines[LI];
  target = { ja: line.ja, kana: line.kana || line.ja };
  document.getElementById('targetJa').textContent = line.ja;
  document.getElementById('targetKana').textContent = line.kana || '';
}).catch(() => {});

let transcriber = null;
el.load.addEventListener('click', async function(){
  this.disabled = true;
  stage('下載模型', '連線中…', 0);
  log('開始載入 Xenova/whisper-tiny（quantized）');
  const t = performance.now();
  try {
    transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
      quantized: true,
      progress_callback: p => {
        if (p.status === 'progress' && p.total){
          stage('下載模型', p.file + ' ' + (p.loaded / 1048576).toFixed(1) + ' / ' + (p.total / 1048576).toFixed(1) + ' MB',
                p.loaded / p.total * 100);
        } else if (p.status === 'done'){
          log('✓ ' + p.file);
        } else if (p.status === 'initiate'){
          log('開始下載 ' + p.file);
        }
      }
    });
    log('✓ 模型就緒，用時 ' + Math.round(performance.now() - t) + ' ms');
    stage('模型已就緒', '可以開始收音', 100);
    this.textContent = '模型已載入';
    el.rec.disabled = false;
  } catch (e){
    log('失敗：' + (e && (e.message || e)));
    stage('失敗', '看下方記錄', 0);
    this.disabled = false;
  }
});

let mediaRecorder = null, chunks = [], recStart = 0;
el.rec.addEventListener('click', async function(){
  if (!transcriber) return;
  chunks = [];
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      el.rec.disabled = false;
      el.stop.disabled = true;
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      log('錄音完成：' + (blob.size / 1024).toFixed(1) + ' KB，' + ((performance.now() - recStart) / 1000).toFixed(1) + ' 秒');
      transcribeBlob(blob);
    };
    mediaRecorder.start();
    recStart = performance.now();
    stage('收音中', '請照上面的句子唸一次，然後按「停止並辨識」', 100);
    this.disabled = true;
    el.stop.disabled = false;
    log('開始收音（' + mediaRecorder.mimeType + '）');
  } catch (e){
    log('失敗：麥克風 — ' + e.name + ' ' + (e.message || ''));
    stage('麥克風失敗', e.name, 100);
  }
});

el.stop.addEventListener('click', () => { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); });

async function toFloat32(arrayBuffer){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(arrayBuffer);
  const frames = Math.ceil(buf.duration * 16000);
  const off = new OfflineAudioContext(1, frames, 16000);
  const src = off.createBufferSource();
  src.buffer = buf; src.connect(off.destination); src.start();
  const rendered = await off.startRendering();
  ctx.close();
  return rendered.getChannelData(0);
}

async function transcribeBlob(blob){
  stage('準備音訊', '解碼與重取樣…', 100);
  const t0 = performance.now();
  let audio;
  try {
    audio = await toFloat32(await blob.arrayBuffer());
    log('音訊長度 ' + (audio.length / 16000).toFixed(2) + ' 秒，解碼用時 ' + Math.round(performance.now() - t0) + ' ms');
  } catch (e){
    log('失敗：音訊解碼 — ' + (e.message || e));
    stage('解碼失敗', '', 0);
    return;
  }
  stage('辨識中', '在瀏覽器內運算，請稍等…', 100);
  const t1 = performance.now();
  try {
    const out = await transcriber(audio, { language: 'ja', task: 'transcribe' });
    const text = (out && out.text || '').trim();
    log('✓ 辨識完成，用時 ' + Math.round(performance.now() - t1) + ' ms：' + text);
    show(text);
    stage('已完成', '按「開始收音」再試一次', 100);
  } catch (e){
    log('失敗：辨識 — ' + (e && e.message));
    stage('辨識失敗', '', 100);
  }
}

function show(text){
  el.said.textContent = text || '（沒有辨識到內容）';
  el.score.textContent = '與本句比對：' + lcsScore(target.kana, text) + ' 分（假名對上的比例）';
}

/* 測試用：?audio=<URL> 直接跑一段音檔 */
const audioParam = qs.get('audio');
if (audioParam){
  window.__runAudio = async (url) => {
    el.load.click();
    const wait = setInterval(() => {
      if (transcriber){ clearInterval(wait); }
    }, 300);
    await new Promise(r => {
      const iv = setInterval(() => { if (transcriber){ clearInterval(iv); r(); } }, 300);
      setTimeout(() => { clearInterval(iv); r(); }, 180000);
    });
    if (!transcriber){ log('失敗：模型未就緒'); return; }
    const blob = await (await fetch(url)).blob();
    log('載入測試音檔：' + url + '（' + (blob.size / 1024).toFixed(1) + ' KB）');
    await transcribeBlob(blob);
  };
  window.__runAudio(audioParam);
}
</script>
</body>
</html>
