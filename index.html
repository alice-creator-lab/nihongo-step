<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>日語階梯 · nihongo-step</title>
<meta name="description" content="依照初級 40 課編排，一步一步學日語。第一課：自我介紹。" />
<meta name="theme-color" content="#f6f2ea" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  :root{
    --paper:#f6f2ea; --card:#fffdf8; --ink:#221e19; --ink2:#5d5549; --muted:#98907f;
    --line:#e5dccb; --shu:#b03a2e; --ai:#31507a; --gold:#8c6a2c;
    --serif:"Hiragino Mincho ProN","Yu Mincho","Songti TC","Noto Serif CJK TC",serif;
    --sans:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 18% -8%, #fffbf2 0, rgba(255,251,242,0) 46%),
                     radial-gradient(circle at 92% 2%, #f0e7d5 0, rgba(240,231,213,0) 38%);
    background-attachment:fixed;
    color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 16px 40px}
  .jp, .serif{font-family:var(--serif)}
  a{color:inherit}

  /* header */
  .hdr{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-top)) ;
    padding-top:calc(10px + env(safe-area-inset-top));
    background:rgba(246,242,234,.86); backdrop-filter:saturate(1.4) blur(12px);
    -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:baseline; gap:7px; text-decoration:none; flex:1; min-width:0}
  .brand .b1{font-family:var(--serif); font-size:15px; letter-spacing:.18em}
  .brand .b2{font-size:12.5px; color:var(--muted); letter-spacing:.12em}
  .hact{display:flex; align-items:center; gap:6px}
  .chip{font-family:var(--sans); font-size:12px; color:var(--ink2); background:#fffdf8;
    border:1px solid var(--line); border-radius:999px; padding:6px 11px; line-height:1}
  .chip[aria-pressed="true"]{background:var(--ink); color:#fffdf8; border-color:var(--ink)}
  .ver{font-size:10.5px; color:var(--muted); letter-spacing:.08em; padding-left:2px}

  /* map */
  .hero{margin-top:18px; padding:22px 20px 20px; border:1px solid var(--line); border-radius:22px;
    background:linear-gradient(158deg,#fffdf8 0%,#f4ece0 100%);
    box-shadow:inset 0 1px 0 #fff, 0 18px 40px -32px rgba(70,52,20,.7)}
  .eyebrow{margin:0; font-size:11px; letter-spacing:.22em; color:var(--shu); text-transform:uppercase}
  .hero h1{margin:10px 0 6px; font-size:24px; line-height:1.45; font-weight:600; letter-spacing:.01em}
  .hero .sub{margin:0; font-size:13px; color:var(--ink2); line-height:1.8}
  .bar{margin:16px 0 6px; height:6px; border-radius:99px; background:#e9e0ce; overflow:hidden}
  .bar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--shu),#d5854f); transition:width .4s ease}
  .hrow{display:flex; align-items:center; gap:12px; margin-top:14px; flex-wrap:wrap}
  .cta{appearance:none; border:0; background:var(--shu); color:#fffdf8; font-family:var(--sans);
    font-size:14.5px; padding:12px 22px; border-radius:999px; letter-spacing:.04em;
    box-shadow:0 10px 22px -14px rgba(176,58,46,.9)}
  .cta:active{transform:translateY(1px)}
  .hint{font-size:12.5px; color:var(--muted)}

  .book{margin-top:26px}
  .bookhd{display:flex; align-items:baseline; gap:9px; padding:0 4px 9px; flex-wrap:wrap}
  .bookhd .bn{font-size:12.5px; letter-spacing:.16em; color:var(--ink)}
  .bookhd .meta{font-size:11.5px; color:var(--muted); letter-spacing:.02em}
  .badge{font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line);
    background:#fffdf8; color:var(--ink2); line-height:1.5}
  .badge.ai{color:var(--ai); border-color:#cdd8e6}
  .list{border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--card)}
  .lrow{display:flex; align-items:center; gap:12px; padding:13px 14px; text-decoration:none;
    border-bottom:1px solid var(--line); min-height:52px; position:relative}
  .lrow:last-child{border-bottom:0}
  .lrow .no{font-size:11.5px; color:var(--muted); width:24px; letter-spacing:.06em; font-variant-numeric:tabular-nums}
  .lrow .ttl{flex:1; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lrow .lbar{position:absolute; left:14px; right:14px; bottom:0; height:2px; background:#ece3d2; overflow:hidden}
  .lrow .lbar i{display:block; height:100%;
    background:linear-gradient(90deg,var(--shu),#d5854f); transition:width .35s ease}
  .lrow .st{font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; letter-spacing:.02em}
  .lrow.has .st{color:var(--shu)}
  .lrow.open{background:#fffefb}
  .lrow.open .st{color:var(--muted)}
  .lrow.open .ttl{font-weight:600}
  .lrow.done .st{color:#3f7a4f}
  .lrow.lock{opacity:.52}

  .note{margin:22px 4px 0; font-size:11.5px; color:var(--muted); line-height:1.9}

  /* lesson */
  .lhead{padding:18px 2px 4px}
  .back{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2); text-decoration:none}
  .lhead h1{margin:10px 0 0; font-size:26px; font-weight:600; letter-spacing:.01em; line-height:1.35}
  .lhead h1 .k{display:block; margin-top:6px; font-family:var(--serif); font-size:13px; color:var(--muted); letter-spacing:.16em; font-weight:400}
  .goal{margin:10px 0 0; font-size:13.5px; color:var(--ink2); line-height:1.85}

  .tabs{position:sticky; top:calc(49px + env(safe-area-inset-top)); z-index:30;
    display:flex; gap:5px; overflow-x:auto; scrollbar-width:none;
    padding:9px 2px 9px; margin-top:6px;
    background:linear-gradient(var(--paper) 62%, rgba(246,242,234,0))}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; appearance:none; border:1px solid var(--line); background:#fffdf8;
    color:var(--ink2); font-family:var(--sans); font-size:13px; padding:8px 13px;
    border-radius:999px; display:inline-flex; align-items:center; white-space:nowrap; position:relative}
  .tab.seen{background:#f7f0e2; border-color:#e0d3bd; color:var(--ink2)}
  /* 選中的分頁要壓過「已看」的淺色底，否則白字落在淺底上 */
  .tab.on, .tab.on.seen{background:var(--ink); color:#fffdf8; border-color:var(--ink)}

  .sec{padding-top:6px; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  .secnote{font-size:12.5px; color:var(--muted); line-height:1.8; margin:2px 2px 12px}

  .pat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 16px 14px; margin-bottom:11px}
  .pat .pja{font-family:var(--serif); font-size:19px; line-height:1.5; letter-spacing:.02em}
  .pat .pzh{font-size:13px; color:var(--shu); margin-top:5px}
  .pat .pnote{font-size:13px; color:var(--ink2); line-height:1.85; margin-top:9px}
  .pat .ex{border-top:1px dashed var(--line); margin-top:12px; padding-top:10px}
  .exrow{display:flex; gap:10px; align-items:flex-start; padding:2px 0}
  .exrow .txt{flex:1; min-width:0}
  .exrow .ja{font-family:var(--serif); font-size:16px; line-height:1.7}
  .exrow .zh{font-size:12.5px; color:var(--muted); margin-top:2px}

  .spk{flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:#fffdf8; display:inline-flex; align-items:center; justify-content:center; color:var(--ink2);
    padding:0; margin-top:2px}
  .spk:active{background:#f1e9db}
  .spk svg{width:15px; height:15px; fill:currentColor}
  .spk.playing{background:var(--ink); color:#fffdf8; border-color:var(--ink)}

  .vlist{border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--card)}
  .vrow{display:flex; gap:12px; align-items:center; padding:11px 13px; border-bottom:1px solid var(--line)}
  .vrow:last-child{border-bottom:0}
  .vmain{flex:1; min-width:0}
  .vtop{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .vkanji{font-family:var(--serif); font-size:18px; line-height:1.4}
  .vkana{font-size:12.5px; color:var(--ink2); letter-spacing:.02em}
  .vbtm{display:flex; align-items:baseline; gap:8px; margin-top:2px; flex-wrap:wrap}
  .vzh{font-size:13px; color:var(--ink2)}
  .pos{font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 5px; line-height:1.6}

  .gsec{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:11px}
  .gsec h3{margin:0 0 10px; font-size:15.5px; font-weight:600; letter-spacing:.01em}
  .gsec p{margin:0 0 9px; font-size:13.5px; color:var(--ink2); line-height:1.95}
  .gsec .ex{border-top:1px dashed var(--line); margin-top:11px; padding-top:10px}

  .eitem{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px 16px; margin-bottom:11px}
  .eitem .qh{display:flex; gap:9px; align-items:baseline}
  .eitem .n{font-size:11.5px; color:var(--shu); letter-spacing:.08em}
  .eitem .q{flex:1; font-size:15.5px; line-height:1.75}
  .eitem .hint{font-size:11.5px; color:var(--muted); margin:6px 0 0 24px}
  .ansbtn{appearance:none; margin-top:11px; border:1px solid var(--line); background:#fffdf8; color:var(--ink2);
    font-family:var(--sans); font-size:12.5px; padding:7px 14px; border-radius:999px}
  .ans{display:none; margin-top:10px; padding:11px 13px; background:#f5efe3; border-left:3px solid var(--shu);
    border-radius:0 10px 10px 0; font-family:var(--serif); font-size:15.5px; line-height:1.75}
  .ans.on{display:block}
  .eact{display:flex; gap:8px; margin:2px 2px 12px}

  .dlg{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:11px}
  .dlghd{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px}
  .dlghd h3{margin:0; font-size:15px; font-weight:600; flex:1; min-width:140px}
  .dlg .dnote{font-size:12.5px; color:var(--muted); line-height:1.8; margin:2px 0 8px}
  .line{padding:10px 0; border-bottom:1px dashed var(--line)}
  .line:last-child{border-bottom:0}
  .line .who{font-size:11.5px; color:var(--shu); letter-spacing:.1em}
  .linerow{display:flex; gap:10px; align-items:flex-start}
  .linerow .txt{flex:1; min-width:0}
  .line .ja{font-family:var(--serif); font-size:16.5px; line-height:1.75}
  .line .zh{font-size:12.5px; color:var(--muted); margin-top:3px}
  body.hidezh .zh{display:none}
  .line.playing{background:#f7f0e2; border-radius:10px; box-shadow:0 0 0 10px #f7f0e2}

  .cul{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 18px 12px}
  .cul h3{margin:0 0 12px; font-family:var(--serif); font-size:17px; font-weight:600; line-height:1.5}
  .cul p{margin:0 0 12px; font-size:14px; color:var(--ink2); line-height:2}

  /* quiz bar, flashcard, quiz, sheet */
  .quizbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin:2px 0 12px}
  .qinfo{flex:1; min-width:130px}
  .qinfo b{display:block; font-size:14px; font-weight:600}
  .qinfo span{font-size:11.5px; color:var(--muted)}
  .seg2{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fffdf8}
  .seg2 button{appearance:none; border:0; background:transparent; font-family:var(--sans); font-size:12px;
    color:var(--ink2); padding:7px 11px}
  .seg2 button.on{background:var(--ink); color:#fffdf8}
  .quizbar .btn2{padding:9px 15px; font-size:13px}
  .cardmeta{text-align:center; font-size:11.5px; color:var(--muted); letter-spacing:.1em; margin:8px 0 10px}
  .fcard{background:linear-gradient(160deg,#fffdf8,#f7f0e2); border:1px solid var(--line); border-radius:20px;
    min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:26px 18px; text-align:center}
  .fcard .fq{font-family:var(--serif); font-size:30px; line-height:1.45}
  .fcard .fsub{font-size:13px; color:var(--muted); letter-spacing:.06em}
  .fcard .fa{font-size:19px; line-height:1.65; border-top:1px dashed var(--line); padding-top:12px;
    margin-top:6px; width:100%}
  .fcard .fa.hide{display:none}
  .cbtns{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
  .cbtns .btn2{flex:1 1 44%; white-space:nowrap}
  .cbtns button{flex:1; padding:13px 10px; font-size:14.5px}
  .b-ok{background:#3f7a4f; border-color:#3f7a4f; color:#fff}
  .b-no{background:#fffdf8; border-color:#e0c3be; color:var(--shu)}
  .qcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px}
  .qnum{font-size:11.5px; color:var(--shu); letter-spacing:.08em}
  .qq{font-size:16px; line-height:1.8; margin:7px 0 12px}
  .qinput{width:100%; font-family:var(--serif); font-size:17px; padding:12px 13px; border-radius:12px;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink); outline:none}
  .qinput:focus{border-color:#c9a882; box-shadow:0 0 0 3px rgba(176,58,46,.07)}
  .row2{display:flex; gap:9px; margin-top:12px; flex-wrap:wrap}
  .fb{margin-top:11px; font-size:14px; line-height:1.7}
  .fb.ok{color:#3f7a4f}
  .fb.bad{color:var(--shu)}
  .fb .corr{display:block; margin-top:4px; font-family:var(--serif); font-size:15.5px; color:var(--ink)}
  .sum{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 18px; text-align:center}
  .sum .big{font-family:var(--serif); font-size:36px; line-height:1.2}
  .sum .big small{font-size:14px; color:var(--muted)}
  .chips{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:12px 0}
  .chips span{font-family:var(--serif); font-size:14px; border:1px solid var(--line); border-radius:999px;
    padding:4px 11px; background:#fffdf8}
  .linkbtn{appearance:none; border:0; background:transparent; color:var(--shu); font-family:var(--sans);
    font-size:12.5px; padding:0; text-decoration:underline; text-underline-offset:3px}
  .sheet{position:fixed; inset:0; background:rgba(34,30,25,.42); z-index:60; display:none; align-items:flex-end}
  .sheet.on{display:flex}
  .sheetbox{background:var(--paper); width:100%; max-width:760px; margin:0 auto; border-radius:20px 20px 0 0;
    max-height:76vh; overflow:auto; padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
  .sheetbox h3{margin:0 0 3px; font-size:16px}
  .mk{display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line)}
  .mk .k{flex:1; min-width:0}
  .mk .k b{display:block; font-family:var(--serif); font-size:15px; font-weight:500}
  .mk .k span{font-size:12px; color:var(--muted)}
  .mk .n{font-size:11px; color:var(--shu); white-space:nowrap}

  /* role play + listening */
  .rolecard{background:linear-gradient(160deg,#fffdf8,#f7f0e2); border:1px solid var(--line);
    border-radius:20px; padding:20px 18px; text-align:center}
  .rolecard.other{background:#f6f2ea; border-style:dashed}
  .rlabel{font-size:11.5px; color:var(--shu); letter-spacing:.12em; margin-bottom:8px}
  .rja{font-family:var(--serif); font-size:21px; line-height:1.7}
  .rzh{font-size:13px; color:var(--muted); margin-top:8px}
  body.hidezh .rzh{display:none}
  .choice{display:block; width:100%; text-align:left; appearance:none; font-family:var(--sans);
    font-size:14.5px; line-height:1.6; color:var(--ink); background:#fffdf8; border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; margin-bottom:8px}
  .choice:last-child{margin-bottom:0}
  .choice.ok{border-color:#7fa77f; background:#eef4ec}
  .choice.bad{border-color:#d9a9a2; background:#fbf0ee}
  .choice.dim{opacity:.55}
  .mic{width:100%}

  /* 跟讀評分 */
  .lacts{display:flex; flex-direction:column; gap:6px; flex:0 0 auto}
  .spk.sm{width:26px; height:26px}
  .spk.sm svg{width:13px; height:13px}
  .spk.rec{background:var(--shu); border-color:var(--shu); color:#fffdf8}
  .rkana{font-size:12.5px; color:var(--muted); margin-top:6px; letter-spacing:.02em}
  .scorebox{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; text-align:center; margin-top:12px}
  .scorebox .num{font-family:var(--serif); font-size:40px; line-height:1.1}
  .scorebox .num small{font-size:14px; color:var(--muted)}
  .scorebox .verdict{font-size:14px; margin:6px 0 0; color:var(--ink2)}
  .scorebox .target{font-family:var(--serif); font-size:17px; line-height:1.9; margin-top:12px; letter-spacing:.02em}
  .scorebox .target b.miss{color:var(--shu); font-weight:400; text-decoration:underline; text-underline-offset:3px}
  .scorebox .heard{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.7}
  .scorebox .note{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.7}
  .spkprog{font-size:12.5px; color:var(--ink2); text-align:center; min-height:18px; line-height:1.6}
  .qinput{width:100%; box-sizing:border-box; margin-top:12px; padding:12px 14px; min-height:80px;
    font-size:19px; line-height:1.6; color:var(--ink); background:#fffdf8;
    border:1px solid var(--line); border-radius:14px; resize:none; outline:none;
    -webkit-appearance:none; font-family:inherit}
  .qinput:focus{border-color:var(--ink2)}
  .padhint2{font-size:11.5px; line-height:1.65; color:var(--muted); margin:8px 2px 12px}
  .padwrap{position:relative; margin-top:12px; background:#fffdf8; border:1px solid var(--line); border-radius:14px;
    background-image:linear-gradient(#f1eade 1px, transparent 1px), linear-gradient(90deg, #f1eade 1px, transparent 1px);
    background-size:100% 50px, 50px 100%; background-position:0 49px, 49px 0;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}
  .pad{display:block; width:100%; height:200px; touch-action:none; border-radius:14px;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    -webkit-user-drag:none; outline:none}
  .slots{display:flex; flex-wrap:wrap; gap:5px; margin:12px 0 2px; min-height:40px}
  .slot{width:32px; height:38px; display:flex; align-items:center; justify-content:center;
    font-size:19px; color:var(--ink); border-bottom:2px solid var(--line)}
  .slot.filled{border-bottom-color:var(--ink2)}
  .slot.bad{color:#b03a2e; border-bottom-color:#b03a2e}
  .slot.cur{background:#f7f0e2; border-radius:7px}
  .candlabel{font-size:12.5px; color:var(--ink2); margin:12px 0 7px}
  .candrow{display:flex; flex-wrap:wrap; gap:8px}
  .cand{min-width:54px; height:54px; font-size:23px; line-height:1; border:1px solid var(--line);
    border-radius:12px; background:var(--card); color:var(--ink); -webkit-tap-highlight-color:transparent}
  .cand.ghost{font-size:13px; min-width:auto; padding:0 12px; color:var(--ink2)}
  body.writing, body.writing *{-webkit-user-select:none !important; user-select:none !important;
    -webkit-touch-callout:none !important}
  .btn2, .chip, .cta, .tab{-webkit-tap-highlight-color:transparent}
  .padhint{position:absolute; left:0; right:0; bottom:7px; text-align:center; font-size:11.5px; color:var(--muted); pointer-events:none}
  .dictbox{margin-top:14px; border:1px solid var(--line); border-radius:14px; background:var(--card); padding:10px 13px}
  .dictbox summary{font-size:13.5px; color:var(--ink2); outline:none}
  .dictbox[open] summary{margin-bottom:10px; color:var(--ink)}
  .dictbox textarea{width:100%; font-family:var(--serif); font-size:16px; padding:11px 12px; border-radius:12px;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink); outline:none; resize:vertical}
  .dictbox .note{font-size:12px; color:var(--muted); line-height:1.7; margin:8px 0}

  .lfoot{margin:22px 0 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .btn2{appearance:none; border:1px solid var(--line); background:#fffdf8; color:var(--ink);
    font-family:var(--sans); font-size:14px; padding:12px 20px; border-radius:999px}
  .btn2.done{background:#eef4ec; border-color:#cfe0cd; color:#3f7a4f}
  .nav2{display:flex; justify-content:space-between; gap:10px; margin-top:6px}

  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%,12px);
    background:rgba(34,30,25,.94); color:#fffdf8; font-size:13px; padding:10px 16px; border-radius:999px;
    opacity:0; pointer-events:none; transition:.22s ease; z-index:99; max-width:88vw; text-align:center}
  .toast.on{opacity:1; transform:translate(-50%,0)}
  .err{margin:40px 0; text-align:center; font-size:14px; color:var(--ink2); line-height:1.9}
  @media (min-width:700px){
    .hero h1{font-size:27px}
    .lhead h1{font-size:29px}
    .tabs{top:49px}
  }
</style>
</head>
<body>
<header class="hdr">
  <a class="brand" href="#/">
    <span class="b1 jp">日本語階梯</span>
    <span class="b2">nihongo-step</span>
  </a>
  <div class="hact">
    <button class="chip" id="slowBtn" aria-pressed="false" title="以較慢速度播放示範語音">慢速</button>
    <span class="ver" id="verTag">v21</span>
  </div>
</header>
<main class="wrap" id="app"><div class="err">載入中……</div></main>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="錯題簿">
  <div class="sheetbox" id="sheetbox"></div>
</div>
<noscript><div class="wrap err">此應用需要 JavaScript。</div></noscript>

<script>
(function(){
  'use strict';
  var $ = function(s, r){ return (r||document).querySelector(s); };
  var app = $('#app');
  var PKEY = 'ngs-progress-v1';
  var SKEY = 'ngs-slow';

  var SEGS = 6;               /* 六段；TABS 在這行之後才定義，所以另外留一個常數 */
  var P = loadProgress();
  var course = null;
  var lessons = {};           /* id -> lesson json */
  var slow = localStorage.getItem(SKEY) === '1';
  var TABS = [
    ['patterns','句型'], ['vocab','單字'], ['grammar','文法'],
    ['exercises','練習'], ['dialogue','會話'], ['culture','文化']
  ];

  var VOICE = { ja: null };
  /* iOS 把「增強版」人聲的名字列成跟基本版一樣（都是 Kyoko），
     差別在 voiceURI，例如 com.apple.voice.enhanced.ja-JP.Kyoko，
     所以兩者都要看，否則永遠認不出增強版。 */
  function voiceTag(v){ return ((v && v.name) || '') + ' ' + ((v && v.voiceURI) || ''); }
  function isEnhancedVoice(v){ return /enhanced|premium|neural|siri/i.test(voiceTag(v)); }
  function pickVoice(){
    if (!('speechSynthesis' in window)) return null;
    var vs = (speechSynthesis.getVoices() || []).filter(function(v){ return /^ja/i.test(v.lang); });
    if (!vs.length){ return VOICE.ja; }
    function rank(v){
      var n = voiceTag(v), s = 0;
      if (/enhanced/i.test(n)) s += 60;
      if (/premium|neural|siri/i.test(n)) s += 50;
      if (/Kyoko|O-ren|Oren|Hattori|Otoya/i.test(n)) s += 20;
      if (/JP/i.test(v.lang)) s += 3;
      if (!v.localService) s += 1;
      return s;
    }
    var best = vs.slice().sort(function(a,b){ return rank(b) - rank(a); })[0];
    VOICE.ja = best;
    return best;
  }
  if (location.search.indexOf('dbg=1') >= 0){
    window.__voice = { pick: pickVoice, isEnhanced: isEnhancedVoice, get: function(){ return VOICE.ja; } };
  }
  if ('speechSynthesis' in window){
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
    /* 第一次觸碰時再抓一次，iOS 的清單常在互動後才完整 */
    document.addEventListener('pointerdown', function(){ pickVoice(); }, { once:true });
  }

  function loadProgress(){
    try{
      var p = JSON.parse(localStorage.getItem(PKEY) || 'null');
      if (p && typeof p === 'object' && p.lessons){
        /* 舊資料：六段都看過但未有 done 旗標的，統一補上，避免「已完成課數」與百分比不一致 */
        Object.keys(p.lessons).forEach(function(id){
          var r = p.lessons[id] || {};
          if ((r.segs || []).length >= SEGS) r.done = true;
        });
        return p;
      }
    }catch(e){}
    return { v:1, lessons:{}, last:null };
  }
  function saveProgress(){
    try{ localStorage.setItem(PKEY, JSON.stringify(P)); }catch(e){}
  }
  function rec(id){
    if (!P.lessons[id]) P.lessons[id] = { done:false, segs:[] };
    if (!P.lessons[id].segs) P.lessons[id].segs = [];
    return P.lessons[id];
  }

  /* 錯題簿：單字自測與文型練習共用，F8 會接手做間隔複習 */
  var MKEY = 'ngs-mistakes-v1';
  var M = (function(){
    try{
      var m = JSON.parse(localStorage.getItem(MKEY) || 'null');
      if (m && Array.isArray(m.items)) return m;
    }catch(e){}
    return { v:1, items:[] };
  })();
  function saveMistakes(){
    try{ localStorage.setItem(MKEY, JSON.stringify(M)); }catch(e){}
  }
  /* 同一題／同一個字只留一筆：先按 key，再按內容簽名（舊資料可能 key 不同） */
  function mistakeSig(x){ return (x.kind||'') + '|' + (x.prompt||'') + '|' + (x.answer||'') + '|' + (x.sub||''); }
  function dedupeMistakes(){
    var byKey = {}, bySig = {}, out = [];
    M.items.forEach(function(x){
      var sig = mistakeSig(x);
      var hit = byKey[x.key] || bySig[sig];
      if (hit){ hit.n = (hit.n||1) + (x.n||1); hit.at = Math.max(hit.at||0, x.at||0); return; }
      byKey[x.key] = x; bySig[sig] = x; out.push(x);
    });
    M.items = out;
  }
  dedupeMistakes();
  saveMistakes();
  function addMistake(o){
    var sig = mistakeSig(o);
    var hit = M.items.filter(function(x){ return x.key === o.key || mistakeSig(x) === sig; })[0];
    if (hit){ hit.n = (hit.n||1) + 1; hit.at = Date.now(); }
    else {
      M.items.unshift({ key:o.key, kind:o.kind, prompt:o.prompt, answer:o.answer, sub:o.sub||'', at:Date.now(), n:1 });
      if (M.items.length > 120) M.items.length = 120;
    }
    dedupeMistakes();
    saveMistakes();
  }
  function mistakeCount(){ return M.items.length; }

  /* 答案比對：去掉空白與標點、全形轉半形，再逐字比對 */
  function norm(s){
    return String(s == null ? '' : s)
      .replace(/[\u3000\s]/g, '')
      .replace(/[。、，．,.！!？?「」『』（）()]/g, '')
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .toLowerCase();
  }

  function toast(msg){
    var t = $('#toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2000);
  }

  var playingEl = null;
  function stopAudio(){
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (typeof curAudio !== 'undefined' && curAudio){ curAudio.pause(); curAudio = null; }
    if (playingEl) playingEl.classList.remove('playing');
    playingEl = null;
    Array.prototype.forEach.call(document.querySelectorAll('.spk.playing'), function(b){ b.classList.remove('playing'); });
  }
  function utter(text, rate, onend){
    if (!('speechSynthesis' in window)){ toast('此裝置不支援語音合成'); return null; }
    var u = new SpeechSynthesisUtterance(String(text).replace(/[～~]/g, ''));
    u.lang = 'ja-JP';
    /* 聲音清單有時要等第一次互動才齊全 */
    pickVoice();
    var v = VOICE.ja;
    /* 只有真的見到「增強／優質」人聲才指定；否則交給系統用
       「設定 → 輔助使用 → 語音內容 → 聲音 → 日文」選定的人聲 */
    if (v && !isEnhancedVoice(v) && /iPhone|iPad|iPod/.test(navigator.userAgent)) v = null;
    if (v) u.voice = v;
    u.rate = rate || (slow ? 0.68 : 0.92);
    u.pitch = 1;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
    return u;
  }
  function speak(text, btn, el){
    stopAudio();
    var u = utter(text);
    if (!u) return;
    if (btn){ btn.classList.add('playing'); playingEl = btn; u.onend = function(){ btn.classList.remove('playing'); }; }
    if (el){ el.classList.add('playing'); playingEl = el; u.onend = function(){ el.classList.remove('playing'); }; }
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  var MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 0 0 3.2-3.2V6.4a3.2 3.2 0 0 0-6.4 0v5.6a3.2 3.2 0 0 0 3.2 3.2z"/><path d="M6.4 11.4a5.6 5.6 0 0 0 11.2 0M12 17v3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.5h3.2L12 5.4v13.2L6.7 14.5H3.5z"/><path d="M15.4 8.4a5 5 0 0 1 0 7.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M17.9 5.9a8.4 8.4 0 0 1 0 12.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';

  function getJSON(path){
    return fetch(path, { cache:'no-cache' }).then(function(r){
      if (!r.ok) throw new Error(path + ' → ' + r.status);
      return r.json();
    });
  }

  /* ---------- map ---------- */
  function availableLessons(){
    var out = [];
    course.books.forEach(function(b){ b.lessons.forEach(function(l){ if (l.available) out.push(l); }); });
    return out;
  }
  function doneCount(){
    return availableLessons().filter(function(l){ return lessonPct(l.id) >= 100; }).length;
  }
  /* 每課進度＝已看段數 ÷ 六段；標記完成即 100% */
  function lessonPct(id){
    var r = P.lessons[id] || {};
    if (r.done) return 100;
    return Math.round(((r.segs || []).length / TABS.length) * 100);
  }
  /* 100% 一律寫「完成」，不再顯示百分比 */
  function pctLabel(id){
    var p = lessonPct(id);
    return p >= 100 ? '完成 ✓' : '進度 ' + p + '%';
  }
  function overallPct(){
    var av = availableLessons();
    if (!av.length) return 0;
    var sum = av.reduce(function(s, l){ return s + lessonPct(l.id); }, 0);
    return Math.round(sum / av.length);
  }

  function renderMap(){
    var av = availableLessons();
    var done = doneCount();
    var pct = overallPct();
    var resumeId = (P.last && av.some(function(l){ return l.id === P.last; })) ? P.last : (av[0] && av[0].id);
    var resumeLabel = '開始第一課';

    var books = course.books.map(function(b){
      var rows = b.lessons.map(function(l){
        var r = P.lessons[l.id] || {};
        if (l.available){
          var p = lessonPct(l.id);
          var fin = p >= 100;
          var cls = 'lrow open' + (fin ? ' done' : '') + (p > 0 && !fin ? ' has' : '');
          var st = fin ? '完成 ✓' : p + '%';
          return '<a class="'+cls+'" href="#/l/'+l.id+'">' +
                   '<span class="no">'+String(l.no).padStart(2,'0')+'</span>' +
                   '<span class="ttl">'+esc(l.title)+'</span>' +
                   '<span class="st">'+st+'</span>' +
                   '<span class="lbar" aria-hidden="true"><i style="width:'+p+'%"></i></span></a>';
        }
        return '<div class="lrow lock">' +
                 '<span class="no">'+String(l.no).padStart(2,'0')+'</span>' +
                 '<span class="ttl">'+esc(l.title)+'</span>' +
                 '<span class="st">未開放</span></div>';
      }).join('');
      return '<section class="book">' +
        '<div class="bookhd">' +
          '<span class="bn">第 '+b.no+' 冊</span>' +
          '<span class="badge ai">'+b.level+'</span>' +
          '<span class="badge">'+esc(b.label)+'</span>' +
          '<span class="meta">'+b.vocab+' 單字 · '+b.patterns+' 句型</span>' +
        '</div>' +
        '<div class="list">'+rows+'</div>' +
      '</section>';
    }).join('');

    app.innerHTML =
      '<section class="hero">' +
        '<p class="eyebrow">共 '+av.length+' 課已開放 · 4 冊 40 課</p>' +
        '<h1>從第一課開始，<br>一步一步學。</h1>' +
        '<p class="sub">每課分六段：句型、單字、文法、練習、會話、文化。<br>進度只存在這部裝置，不會上傳。</p>' +
        '<div class="bar"><i style="width:'+pct+'%"></i></div>' +
        '<div class="hrow">' +
          '<button class="cta" id="resume">'+ (done ? '繼續學習' : resumeLabel) +'</button>' +
          '<span class="hint">整體進度 '+pct+'% · 已完成 '+done+' 課</span>' +
          (mistakeCount() ? '<button class="linkbtn" id="mkBtn">錯題簿（'+mistakeCount()+'）</button>' : '') +
        '</div>' +
      '</section>' +
      books +
      '<p class="note">課程順序參照初級綜合教材的 40 課編排；課名、例句、會話與練習均為自編內容，未採用原書文字與錄音。單字數與句型數為該教材公布之統計，僅作進度參考。</p>';

    var rb = $('#resume');
    if (rb) rb.addEventListener('click', function(){
      location.hash = resumeId ? ('#/l/' + resumeId) : '#/';
    });
    var mb = $('#mkBtn');
    if (mb) mb.addEventListener('click', openMistakes);
  }

  /* ---------- lesson ---------- */
  function renderLesson(lesson, tab){
    var segs = TABS.map(function(t){
      var seen = (rec(lesson.id).segs || []).indexOf(t[0]) >= 0;
      return '<button class="tab'+(t[0]===tab?' on':'')+(seen?' seen':'')+'" data-tab="'+t[0]+'">' +
             t[1]+'</button>';
    }).join('');

    app.innerHTML =
      '<div class="lhead">' +
        '<a class="back" href="#/">← 課程地圖</a>' +
        '<p class="eyebrow" id="lprog" style="margin-top:14px">第 '+lesson.book+' 冊 · 第 '+lesson.no+' 課 · '+lesson.level+' · '+pctLabel(lesson.id)+'</p>' +
        '<h1>'+esc(lesson.title)+'<span class="k">'+esc(lesson.titleJa)+'</span></h1>' +
        '<p class="goal">'+esc(lesson.goal)+'</p>' +
      '</div>' +
      '<nav class="tabs" id="tabs">'+segs+'</nav>' +
      '<section class="sec" id="seg"></section>' +
      '<div class="lfoot">' +
        '<button class="btn2'+(rec(lesson.id).done?' done':'')+'" id="finish">' +
          (rec(lesson.id).done ? '已完成 ✓（點擊取消）' : '標記本課完成') + '</button>' +
      '</div>' +
      '<div class="nav2">' +
        '<a class="back" href="#/">回課程地圖</a>' +
        '<a class="back" href="#/l/'+lesson.id+'/vocab">下一段：單字 →</a>' +
      '</div>';

    $('#tabs').addEventListener('click', function(e){
      var b = e.target.closest('.tab'); if (!b) return;
      location.hash = '#/l/' + lesson.id + '/' + b.dataset.tab;
    });
    $('#finish').addEventListener('click', function(){
      var r = rec(lesson.id);
      /* 六段都看過就已經是完成，不允許取消，否則會與課程地圖的「完成」矛盾 */
      if (r.done && (r.segs || []).length >= TABS.length){
        toast('六段都已看過，完成狀態不能取消');
        return;
      }
      r.done = !r.done;
      saveProgress();
      this.classList.toggle('done', r.done);
      this.textContent = r.done ? '已完成 ✓（點擊取消）' : '標記本課完成';
      toast(r.done ? '已記錄：本課完成' : '已取消完成標記');
      if (r.done) setTimeout(function(){ location.hash = '#/'; }, 620);
    });

    drawSeg(lesson, tab);
  }

  function markSeen(id, tab){
    var r = rec(id);
    if (r.segs.indexOf(tab) < 0){ r.segs.push(tab); }
    /* 六段全部看過＝完成，與「標記本課完成」同一狀態，避免數字與百分比不一致 */
    if (r.segs.length >= TABS.length) r.done = true;
    saveProgress();
    var b = $('.tab[data-tab="'+tab+'"]');
    if (b) b.classList.add('seen');
  }

  function drawSeg(lesson, tab){
    var host = $('#seg');
    if (!host) return;
    var html = '';
    if (tab === 'patterns') html = segPatterns(lesson);
    else if (tab === 'vocab') html = segVocab(lesson);
    else if (tab === 'grammar') html = segGrammar(lesson);
    else if (tab === 'exercises') html = segExercises(lesson);
    else if (tab === 'dialogue') html = segDialogue(lesson);
    else html = segCulture(lesson);

    host.innerHTML = html;
    markSeen(lesson.id, tab);
    var lp = $('#lprog');
    if (lp) lp.textContent = '第 '+lesson.book+' 冊 · 第 '+lesson.no+' 課 · '+lesson.level+' · '+pctLabel(lesson.id);
    var fb2 = $('#finish');
    if (fb2 && rec(lesson.id).done){ fb2.classList.add('done'); fb2.textContent = '已完成 ✓（點擊取消）'; }
    bindSpeakers(host);
    if (tab === 'exercises') renderExerciseMode(lesson);
    if (tab === 'dialogue') wireDialogue(host, lesson);
    if (tab === 'vocab'){ cardRun = null; wireVocab(host, lesson); }
  }

  function bindSpeakers(host){
    if (host.dataset.spk) return;
    host.dataset.spk = '1';
    host.addEventListener('click', function(e){
      var b = e.target.closest('.spk[data-say]'); if (!b) return;
      speak(b.getAttribute('data-say'), b);
    });
  }

  function segPatterns(l){
    var h = '<p class="secnote">先看句型，再聽例句。點右邊的喇叭可以聽示範發音。</p>';
    l.patterns.forEach(function(p){
      h += '<article class="pat"><div class="pja">'+esc(p.ja)+'</div>' +
           '<div class="pzh">'+esc(p.zh)+'</div>' +
           '<div class="pnote">'+esc(p.note)+'</div>';
      if (p.ex && p.ex.length){
        h += '<div class="ex">';
        p.ex.forEach(function(x){
          h += '<div class="exrow"><div class="txt">' +
               '<div class="ja">'+esc(x.ja)+'</div>' +
               '<div class="zh">'+esc(x.zh)+'</div></div>' +
               '<button class="spk" data-say="'+esc(x.kana || x.ja)+'" aria-label="播放例句">'+SPK+'</button></div>';
        });
        h += '</div>';
      }
      h += '</article>';
    });
    return h;
  }

  var cardDir = 'jp2zh';
  var cardRun = null;

  function shuffle(a){
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  function segVocab(l){
    var h = '<div class="quizbar"><div class="qinfo"><b>單字自測</b><span>抽 10 個字，先回想再看答案</span></div>' +
              '<div class="seg2" id="cardDir">' +
                '<button data-dir="jp2zh" class="'+(cardDir==='jp2zh'?'on':'')+'">日→中</button>' +
                '<button data-dir="zh2jp" class="'+(cardDir==='zh2jp'?'on':'')+'">中→日</button>' +
              '</div>' +
              '<button class="btn2" id="startCards">開始</button></div>' +
            '<p class="secnote">共 '+l.vocab.length+' 個字詞。點單字右邊的喇叭聽發音；慢速可在右上角開啟。</p><div class="vlist">';
    l.vocab.forEach(function(v){
      var head = v.kanji ? '<span class="vkanji">'+esc(v.kanji)+'</span><span class="vkana">'+esc(v.kana)+'</span>'
                         : '<span class="vkanji">'+esc(v.kana)+'</span>';
      h += '<div class="vrow"><div class="vmain">' +
             '<div class="vtop">'+head+'</div>' +
             '<div class="vbtm"><span class="vzh">'+esc(v.zh)+'</span><span class="pos">'+esc(v.pos)+'</span></div>' +
           '</div>' +
           '<button class="spk" data-say="'+esc(v.kana)+'" aria-label="播放發音">'+SPK+'</button></div>';
    });
    h += '</div>';
    return h;
  }

  function wireVocab(host, l){

  var SPKKEY = 'ngs-speak-v1';
  var SB = (function(){
    try{ var o = JSON.parse(localStorage.getItem(SPKKEY) || 'null'); if (o && typeof o === 'object') return o; }catch(e){}
    return {};
  })();
  function saveSpeak(){ try{ localStorage.setItem(SPKKEY, JSON.stringify(SB)); }catch(e){} }
  function speakBest(l, di, li){ return SB[l.id+':'+di+':'+li] || 0; }
  function setSpeakBest(l, di, li, score){

  var IS_STANDALONE = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                      || navigator.standalone === true;
  function asrSupported(){
    return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }

  function toHira(s){
    return String(s).replace(/[\u30a1-\u30f6]/g, function(c){
      return String.fromCharCode(c.charCodeAt(0) - 0x60);
    });
  }
  function cleanKana(s){
    return toHira(String(s == null ? '' : s))
      .replace(/[\s\u3000]/g, '')
      .replace(/[、。，．,.！!？?「」『』（）()・…~～ー―-]/g, '');
  }
  function lcsTable(a, b){
    var m = a.length, n = b.length, dp = [], i, j;
    for (i = 0; i <= m; i++){ dp.push(new Array(n + 1)); for (j = 0; j <= n; j++) dp[i][j] = 0; }
    for (i = 1; i <= m; i++){
      for (j = 1; j <= n; j++){
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
      }
    }
    return dp;
  }
  function similarity(target, heard){
    var a = cleanKana(target).split(''), b = cleanKana(heard).split('');
    if (!a.length || !b.length) return 0;
    var dp = lcsTable(a, b);
    /* 以「目標句對上了多少」計分：唸漏整段會明顯扣分，多唸一點不至於扣光 */
    return Math.round(dp[a.length][b.length] / a.length * 100);
  }
  function markTarget(target, heard){
    var a = cleanKana(target).split(''), b = cleanKana(heard).split('');
    var dp = lcsTable(a, b), keep = {}, i = a.length, j = b.length;
    while (i > 0 && j > 0){
      if (a[i-1] === b[j-1]){ keep[i-1] = 1; i--; j--; }
      else if (dp[i-1][j] >= dp[i][j-1]) i--;
      else j--;
    }
    return a.map(function(ch, k){ return keep[k] ? esc(ch) : '<b class="miss">'+esc(ch)+'</b>'; }).join('');
  }

  function openSpeak(l, di, li){
    var d = l.dialogues[di], line = d.lines[li];

    host.innerHTML =

      '<p class="secnote">「自動辨識」在手機瀏覽器內執行，第一次需下載約 40MB 模型；音訊不會上傳。</p>' +
      '<div class="cbtns" style="margin-top:10px"><button class="btn2" id="spkBack">回會話</button></div>';

    $('#spkModel').addEventListener('click', function(){ speak(line.kana || line.ja); });
    $('#spkBack').addEventListener('click', function(){
      if (spkState.rec){ try{ spkState.rec.stop(); }catch(e){} spkState.rec = null; }
      stopAudio();
      $('#seg').innerHTML = segDialogue(l);
      bindSpeakers($('#seg'));
      wireDialogue($('#seg'), l);
    });
    if (ok) $('#spkRec').addEventListener('click', function(){ startSpeak(l, di, li, line); });
    $('#spkAuto').addEventListener('click', function(){ autoRead(l, di, li, line); });
    

  }

  /* 手機內 Whisper 自動辨識：首次使用才下載模型，之後沿用同一個實例 */
  var whisperP = null, whisperTr = null, whisperRec = null, whisperTimer = 0, whisperStream = null;

  function spkProg(t){ var el = $('#spkProg'); if (el) el.textContent = t || ''; }

  function loadWhisper(){
    if (whisperTr) return Promise.resolve(whisperTr);
    if (whisperP) return whisperP;
    spkProg('首次載入辨識模型（約 40MB），可能要一至兩分鐘…');
    whisperP = import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2').then(function(m){
      m.env.allowLocalModels = false;
      if (m.env.backends && m.env.backends.onnx && m.env.backends.onnx.wasm) m.env.backends.onnx.wasm.numThreads = 1;
      return m.pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
        quantized: true,
        progress_callback: function(pr){
          if (pr && pr.status === 'progress' && pr.total) spkProg('下載模型 ' + Math.round(pr.loaded / pr.total * 100) + '%');
        }
      });
    }).then(function(tr){ whisperTr = tr; spkProg(''); return tr; })
      .catch(function(e){ whisperP = null; spkProg(''); throw e; });
    return whisperP;
  }

  function blobToAudio(blob){
    return blob.arrayBuffer().then(function(ab){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      return ctx.decodeAudioData(ab).then(function(buf){
        var frames = Math.max(1, Math.ceil(buf.duration * 16000));
        var off = new OfflineAudioContext(1, frames, 16000);
        var src = off.createBufferSource();
        src.buffer = buf; src.connect(off.destination); src.start();
        return off.startRendering().then(function(r){
          try { ctx.close(); } catch(e){}
          return r.getChannelData(0);
        });
      }, function(e){ try { ctx.close(); } catch(x){} throw e; });
    });
  }

  function autoRead(l, di, li, line){
    var btn = $('#spkAuto');
    if (!btn) return;
    if (whisperRec && whisperRec.state === 'recording'){ whisperRec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder){ toast('此瀏覽器不支援錄音'); return; }
    btn.disabled = true;
    loadWhisper().then(function(){
      spkProg('要求麥克風…');
      return navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, channelCount:1 } }).then(function(stream){
        whisperStream = stream;
        return new Promise(function(resolve, reject){
          var chunks = [];
          var mr = new MediaRecorder(stream);
          whisperRec = mr;
          mr.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
          mr.onerror = function(e){ reject((e && e.error) || new Error('錄音失敗')); };
          mr.onstop = function(){
            if (whisperStream){ whisperStream.getTracks().forEach(function(t){ t.stop(); }); whisperStream = null; }
            whisperRec = null;
            clearTimeout(whisperTimer);
            resolve(new Blob(chunks, { type: mr.mimeType || 'audio/webm' }));
          };
          mr.start();
          btn.disabled = false;
          btn.textContent = '■ 停止並辨識';
          spkProg('收音中：照句子唸一次，唸完按「停止並辨識」');
          whisperTimer = setTimeout(function(){ if (mr.state === 'recording') mr.stop(); }, 9000);
        });
      });
    }).then(function(blob){
      if (btn){ btn.disabled = true; btn.textContent = '● 自動辨識'; }
      spkProg('辨識中，請稍等…');
      return blobToAudio(blob).then(function(audio){
        return whisperTr(audio, { language: 'ja', task: 'transcribe' });
      });
    }).then(function(out){
      var text = ((out && out.text) || '').trim();
      if (btn) btn.disabled = false;
      spkProg('');
      if (!text){ toast('沒有辨識到聲音，再試一次'); return; }
      paintScore(l, di, li, line, text, function(){ autoRead(l, di, li, line); }, '辨識結果');
    }).catch(function(e){
      if (btn){ btn.disabled = false; btn.textContent = '● 自動辨識'; }
      spkProg('');
      toast('自動辨識失敗：' + (e && e.message ? e.message : e));
    });
  }

  function startSpeak(l, di, li, line){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var btn = $('#spkRec');
    if (spkState.rec){
      try{ spkState.rec.stop(); }catch(e){}
      spkState.rec = null;
      if (btn){ btn.textContent = '● 開始朗讀'; btn.classList.remove('rec'); }
      return;
    }
    stopAudio();
    var rec;
    try { rec = new SR(); } catch(e){ toast('無法啟動語音辨識'); return; }
    rec.lang = 'ja-JP';
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    rec.continuous = false;

    var settled = false;
    function settle(data){
      if (settled) return;
      settled = true;
      spkState.rec = null;
      if (btn){ btn.textContent = '● 開始朗讀'; btn.classList.remove('rec'); }
      renderSpeakResult(l, di, li, line, data || {});
    }
    rec.onresult = function(ev){
      var alts = [], r = ev.results[0];
      for (var i = 0; i < r.length; i++){ if (r[i].transcript) alts.push(r[i].transcript); }
      settle({ alts: alts });
    };
    rec.onerror = function(ev){ settle({ error: ev.error }); };
    rec.onend = function(){ settle({}); };

    try {
      rec.start();
      spkState.rec = rec;
      if (btn){ btn.textContent = '■ 停止'; btn.classList.add('rec'); }
      var fb = $('#spkFb');
      if (fb) fb.innerHTML = '<p class="secnote" style="text-align:center">正在聽……請照著上面的句子唸一次。</p>';
    } catch(e){ settle({ error: 'start-failed' }); }
  }

  function renderSpeakResult(l, di, li, line, data){
    var fb = $('#spkFb'); if (!fb) return;
    var err = data.error;

    if (err === 'not-allowed'){
      fb.innerHTML = '<div class="scorebox"><p class="verdict">麥克風或辨識權限被拒</p>' +
        '<p class="note">Safari 網址列左邊「aA」或「大小」→ 網站設定 → 麥克風 → 允許；或 設定 → Safari → 麥克風 → 詢問。改完要重新載入頁面。</p>' +
        '<p class="note"><a href="mic-test.html">開測試頁確認是哪一步失敗</a></p></div>';
      return;
    }
    if (err === 'service-not-allowed'){
      fb.innerHTML = '<div class="scorebox"><p class="verdict">語音辨識服務不可用</p>' +
        '<p class="note">系統不讓網頁使用語音辨識。先試：設定 → 一般 → 鍵盤 → 開啟 Enable Dictation 並加入日文；再到 設定 → Siri → Language 改為 Japanese (Japan)。</p>' +
        '<p class="note">暫時可用上面的「錄音對照」：自己唸一次，再與示範並排比較。</p>' +
        '<p class="note"><a href="mic-test.html">開測試頁看錯誤代碼</a></p></div>';
      return;
    }
    if (err === 'language-not-supported'){
      fb.innerHTML = '<div class="scorebox"><p class="verdict">這個系統不支援日語辨識</p>' +
        '<p class="note">請到 設定 → 一般 → 鍵盤 → 鍵盤 → 加入日文鍵盤，然後重新載入頁面。</p></div>';
      return;
    }
    if (err === 'start-failed'){
      fb.innerHTML = '<div class="scorebox"><p class="verdict">未能啟動收音</p><p class="note">請再按一次「開始朗讀」。</p></div>';
      return;
    }
    if (err === 'network'){
      fb.innerHTML = '<div class="scorebox"><p class="verdict">語音辨識需要網路</p><p class="note">請檢查連線後再試。</p></div>';
      return;
    }
    if (!data.alts || !data.alts.length || err === 'no-speech'){
      fb.innerHTML = '<div class="scorebox"><p class="verdict">聽不清楚</p>' +
        '<p class="note">靠近一點、在安靜的地方，按「開始朗讀」再唸一次（這次不計分）。</p></div>';
      return;
    }

    var target = line.kana || line.ja;
    var scored = data.alts.map(function(t){ return { text: t, score: similarity(target, t) }; })
                          .sort(function(a, b){ return b.score - a.score; });
    paintScore(l, di, li, line, scored[0].text, function(){ startSpeak(l, di, li, line); }, '系統聽到');
  }

  function paintScore(l, di, li, line, text, retry, sourceLabel){
    var fb = $('#spkFb'); if (!fb) return;
    var target = line.kana || line.ja;
    var score = similarity(target, text);
    var verdict = score >= 95 ? '很好，接近示範。'
                : score >= 85 ? '不錯，有幾個音沒對上。'
                : score >= 60 ? '再試一次，留意紅色的字。'
                : '和句子差別較大，先聽示範再一次。';
    setSpeakBest(l, di, li, score);

    fb.innerHTML = '<div class="scorebox">' +
        '<div class="num">'+score+'<small> 分</small></div>' +
        '<p class="verdict">'+verdict+'</p>' +
        '<div class="target">'+markTarget(target, text)+'</div>' +
        '<p class="heard">'+(sourceLabel || '你輸入的')+'：'+esc(text)+'</p>' +
        '<p class="note">紅字是沒對上的音。分數＝句子假名對上的比例（'+score+'%），不是考試成績，只反映辨識到的內容。</p>' +
      '</div>' +
      '<div class="cbtns"><button class="btn2" id="spkAgain">再試一次</button>' +
      '<button class="btn2" id="spkModel2">▶ 示範</button></div>';

    var again = $('#spkAgain');
    if (again) again.addEventListener('click', function(){ if (retry) retry(); });
    var m2 = $('#spkModel2');
    if (m2) m2.addEventListener('click', function(){ speak(line.kana || line.ja); });
  }

  function segCulture(l){
    var c = l.culture;
    var h = '<article class="cul"><h3>'+esc(c.title)+'</h3>';
    c.paras.forEach(function(p){ h += '<p>'+esc(p)+'</p>'; });
    h += '</article><p class="secnote" style="margin-top:12px">六段都看過之後，回到最下面可以標記本課完成。</p>';
    return h;
  }

  /* ---------- 錯題簿 ---------- */
  function openMistakes(){
    stopAudio();
    var box = $('#sheetbox');
    var items = M.items;
    var rows = items.length ? items.map(function(x){
      return '<div class="mk"><div class="k"><b>'+esc(x.prompt)+'</b>' +
             '<span>'+(x.kind === 'word' ? '單字' : x.kind === 'listen' ? '聽力' : '練習') +
             (x.sub ? ' · '+esc(x.sub) : '') + ' → '+esc(x.answer)+'</span></div>' +
             (x.n > 1 ? '<span class="n">×'+x.n+'</span>' : '') + '</div>';
    }).join('') : '<p class="secnote">目前沒有錯題。</p>';

    box.innerHTML = '<h3>錯題簿</h3>' +
      '<p class="secnote">答錯的單字與題目會自動記在這裡；進度只存在這部裝置。間隔複習會在後續版本加入。</p>' +
      rows +
      '<div class="row2" style="margin-top:14px">' +
        '<button class="btn2" id="sheetClose">關閉</button>' +
        (items.length ? '<button class="btn2" id="sheetClear">清除全部</button>' : '') +
      '</div>';

    $('#sheet').classList.add('on');
    document.body.style.overflow = 'hidden';
    $('#sheetClose').addEventListener('click', closeSheet);
    if (items.length) $('#sheetClear').addEventListener('click', function(){
      M.items = []; saveMistakes();
      closeSheet(); route(); toast('已清除錯題簿');
    });
    $('#sheet').addEventListener('click', function(e){
      if (e.target.id === 'sheet') closeSheet();
    });
  }
  function closeSheet(){
    var s = $('#sheet');
    if (s) s.classList.remove('on');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeSheet();
  });

  /* ---------- router ---------- */
  function route(){
    stopAudio();
    var h = (location.hash || '#/').replace(/^#/, '');
    var m = h.match(/^\/l\/(L\d{2})(?:\/([a-z]+))?/);
    if (m && lessons[m[1]]){
      var tab = m[2] && TABS.some(function(t){ return t[0] === m[2]; }) ? m[2] : 'patterns';
      P.last = m[1]; saveProgress();
      document.title = '第' + lessons[m[1]].no + '課 ' + lessons[m[1]].title + ' · 日語階梯';
      renderLesson(lessons[m[1]], tab);
      return;
    }
    document.title = '日語階梯 · nihongo-step';
    renderMap();
  }

  function boot(){
    getJSON('data/course.json').then(function(c){
      course = c;
      var ids = availableLessons().map(function(l){ return l.id; });
      return Promise.all(ids.map(function(id){
        return getJSON('data/lesson-' + id + '.json').then(function(j){ lessons[id] = j; })
          .catch(function(e){ console.warn('lesson load failed', id, e); });
      }));
    }).then(function(){
      route();
    }).catch(function(e){
      app.innerHTML = '<div class="err">課程資料載入失敗。<br><small>'+esc(e.message)+'</small></div>';
    });

    $('#slowBtn').setAttribute('aria-pressed', slow ? 'true' : 'false');
    $('#slowBtn').addEventListener('click', function(){
      slow = !slow;
      localStorage.setItem(SKEY, slow ? '1' : '0');
      this.setAttribute('aria-pressed', slow ? 'true' : 'false');
      toast(slow ? '已開啟慢速發音（0.68 倍）' : '已恢復正常速度');
    });
    window.addEventListener('hashchange', route);
  }

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(function(reg){
        reg.update();
      }).catch(function(){});
    });
  }

  boot();
})();
</script>
