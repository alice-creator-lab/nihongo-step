      }
      playAllQueued(items, btn);
    }

    list.addEventListener('click', function(e){
      var gb = e.target.closest('.gplay');
      if (gb){ playFrom(+gb.getAttribute('data-start'), gb); return; }
      var b = e.target.closest('.nbk'); if (!b) return;
      var it = curHit[+b.getAttribute('data-k')]; if (!it) return;
      var x = it.x;
      nbToggle({ id:x.id, vi:x.vi, kanji:x.kanji, kana:x.kana, zh:x.zh,
                 pos: isVerb ? '動詞' : '形容詞', audio: x.audio }, b);
    });

    var pa = $('#allplay');
    if (pa) pa.addEventListener('click', function(){
      if (ALLPLAY.on && ALLPLAY.btn === this){ stopAllPlay(); stopAudio(); return; }
      var rows = list.querySelectorAll('.arow');
      var items = curHit.map(function(it, k){
        return { audio: it.x.audio, el: rows[k] };
      });
      playAllQueued(items, this);
    });
  }

  /* ---------- 動詞詳細表（入口：動詞表每個分類標題） ----------
     欄序：辞書形 → ます形 → て形 → た形 → ない形，辞書形行頭。
     資料由 tools/build_verbforms.py 生成；て形／た形／ない形是規則推導，
     行く、ある、来る、する 等例外寫死在該工具。 */
  var VERBFORMS = null;
  function renderVerbForms(id){
    var set = null;
    (VERBFORMS && VERBFORMS.sets || []).forEach(function(s){ if (s.id === id) set = s; });
    document.title = '動詞詳細表 · 日語階梯';
    if (!set){
      app.innerHTML = '<div class="lhead"><a class="back" href="#/all/verbs">← 動詞表</a>' +
        '<h1>動詞詳細表</h1></div><p class="secnote">資料載入失敗，請重新整理。</p>';
      return;
    }
    var FORMS = [['masu','ます形'],['te','て形'],['ta','た形'],['nai','ない形']];
    var h = '<div class="lhead">' +
      '<a class="back" href="#/all/verbs">← 動詞表</a>' +
      '<h1>' + esc(set.title) + ' 詳細表<span class="k">' + esc(set.kana) + '</span></h1>' +
      '<p class="goal">第一欄是辞書形，之後是ます形、て形、た形、ない形；按語尾的行分類。</p>' +
    '</div>';
    if (set.blocks.length > 1){
      h += '<div class="jumpbar" id="vfjump">' + set.blocks.map(function(b, i){
        return '<button class="jump" data-i="' + i + '">' + esc(b.title) +
               '<b>' + b.rows.length + '</b></button>';
      }).join('') + '</div>';
    }
    h += '<div class="vftblwrap"><table class="vftbl"><colgroup><col class="cd">' +
      '<col class="cf"><col class="cf"><col class="cf"><col class="cf"></colgroup><thead><tr>' +
      '<th>辞書形</th>' + FORMS.map(function(f){ return '<th>' + f[1] + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    set.blocks.forEach(function(b, bi){
      if (!b.rows.length) return;
      h += '<tr class="vgrp" id="vfg-' + bi + '"><th colspan="5">' + esc(b.title) +
           '<em>' + b.rows.length + ' 項</em></th></tr>';
      b.rows.forEach(function(r){
        var au = r.audio || {};
        var kcls = (!r.kanji && r.kana.length >= 7) ? ' class="kl"' : '';
        h += '<tr>' +
          '<td class="vd">' +
            '<div class="vdtop"><b' + kcls + '>' + esc(r.kanji || r.kana) + '</b></div>' +
            (r.kanji ? '<div class="vdsub"><span class="vk">' + esc(r.kana) + '</span></div>' : '') +
          '</td>' +
          FORMS.map(function(f){
            var key = f[0];
            var kf = r['k' + key] || '';
            return '<td class="vf"><span class="fn">' + esc(kf || r[key]) + '</span>' +
              (kf ? '<span class="fk">' + esc(r[key]) + '</span>' : '') +
              (au[key] ? '<button class="spk vspk" data-audio="' + esc(au[key]) +
                '" aria-label="播放' + f[1] + '">' + SPK + '</button>' : '') + '</td>';
          }).join('') +
        '</tr>';
      });
    });
    h += '</tbody></table></div>' +
      '<p class="secnote">示範音檔暫時只有「行く」與「食べる」兩行；其他行先顯示文字。</p>';
    app.innerHTML = h;
    var jb = $('#vfjump');
    if (jb) jb.addEventListener('click', function(e){
      var b = e.target.closest('.jump'); if (!b) return;
      var el = document.getElementById('vfg-' + b.getAttribute('data-i'));
      if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
    });
    var tbl = document.querySelector('.vftbl');
    if (tbl) tbl.addEventListener('click', function(e){
      var b = e.target.closest('.vspk'); if (!b) return;
      if (b.classList.contains('playing')){ stopAudio(); return; }
      stopAudio();
      playFile(b.getAttribute('data-audio'), null, b);
    });
  }

  /* ---------- 形容詞的變化（入口：形容詞表頂部） ----------
     照課本的表格排：欄＝い形容詞／な形容詞，列＝現在・過去 × 肯定・否定。
     每一格右上角的喇叭依次播放該格所有說法（同一格可以有 1–4 句）。 */
  var TAKA = '<ruby>高<rt>たか</rt></ruby>';
  var YUME = '<ruby>有名<rt>ゆうめい</rt></ruby>';
  var AFGRID = [
    { t:'現在', p:'肯定',
      i:[ { h:TAKA+'いです', a:'F1' } ],
      n:[ { h:YUME+'です', a:'F2' } ] },
    { t:'現在', p:'否定',
      i:[ { h:TAKA+'くないです', a:'F3' }, { h:TAKA+'くありません', a:'F9' } ],
      n:[ { h:YUME+'じゃありません', a:'F4' }, { h:YUME+'ではありません', a:'F10' },
          { h:YUME+'じゃないです', a:'F11' }, { h:YUME+'ではないです', a:'F12' } ] },
    { t:'過去', p:'肯定',
      i:[ { h:TAKA+'かったです', a:'F5' } ],
      n:[ { h:YUME+'でした', a:'F6' } ] },
    { t:'過去', p:'否定',
      i:[ { h:TAKA+'くなかったです', a:'F7' }, { h:TAKA+'くありませんでした', a:'F13' } ],
      n:[ { h:YUME+'じゃありませんでした', a:'F8' }, { h:YUME+'ではありませんでした', a:'F14' },
          { h:YUME+'じゃなかったです', a:'F15' }, { h:YUME+'ではなかったです', a:'F16' } ] }
  ];

  var AFPLAY = { on:false, btn:null, i:0 };
  function afStop(){
    AFPLAY.on = false;
    AFPLAY.i = 0;
    if (AFPLAY.btn){ AFPLAY.btn.classList.remove('on'); AFPLAY.btn = null; }
    Array.prototype.forEach.call(document.querySelectorAll('.aftbl .f.on'), function(el){
      el.classList.remove('on');
    });
  }
  function afPlayCell(cell, btn){
    if (AFPLAY.on && AFPLAY.btn === btn){ stopAudio(); afStop(); return; }
    stopAudio();
    afStop();
    var forms = Array.prototype.slice.call(cell.querySelectorAll('.f[data-audio]'));
    if (!forms.length){ toast('這格還沒有音檔'); return; }
    AFPLAY.on = true;
    AFPLAY.btn = btn;
    AFPLAY.i = 0;
    btn.classList.add('on');
    function step(){
      if (!AFPLAY.on) return;
      if (AFPLAY.i >= forms.length){ afStop(); return; }
      var f = forms[AFPLAY.i];
      f.classList.add('on');
      var ok = playFile(f.getAttribute('data-audio'), function(){
        f.classList.remove('on');
        if (!AFPLAY.on) return;
        AFPLAY.i++;
        step();
      });
      if (!ok){ f.classList.remove('on'); afStop(); }
    }
    step();
  }

  function afCellHtml(list){
    return '<td>' +
      list.map(function(f){
        return '<span class="f" data-audio="audio/adjform/' + f.a + '.mp3">' + f.h + '</span>';
      }).join('') +
      '<button class="afspk" aria-label="播放這格">' + SPK + '</button>' +
    '</td>';
  }

  function renderAdjForms(){
    document.title = '形容詞的變化 · 日語階梯';
    var h = '<div class="lhead">' +
      '<a class="back" href="#/all/adjs">← 形容詞表</a>' +
      '<h1>形容詞的變化<span class="k">けいようし の へんか</span></h1>' +
      '<p class="goal">い形容詞與な形容詞的現在、過去，以及肯定、否定。</p>' +
    '</div>' +
    '<div class="aftblwrap"><table class="aftbl">' +
      '<thead><tr><th class="cnr" colspan="2"></th><th>い形容詞</th><th>な形容詞</th></tr></thead><tbody>';

    AFGRID.forEach(function(r, k){
      h += '<tr>' +
        (k % 2 === 0 ? '<th class="tense" rowspan="2">' + r.t + '</th>' : '') +
        '<th class="pol">' + r.p + '</th>' +
        afCellHtml(r.i) + afCellHtml(r.n) +
      '</tr>';
    });

    h += '</tbody></table></div>' +
      '<p class="secnote">點每一格右下角的喇叭，會依次播放該格的所有說法。</p>';

    app.innerHTML = h;
    afStop();
    document.querySelector('.aftbl').addEventListener('click', function(e){
      var b = e.target.closest('.afspk'); if (!b) return;
      afPlayCell(b.closest('td'), b);
    });
  }

  /* ---------- 練習本 ---------- */
  var noteRun = null;
  function renderNotebook(){
    document.title = '練習本 · 日語階梯';
    var n = NB.items.length;
    app.innerHTML =
      '<div class="lhead">' +
        '<a class="back" href="#/">← 課程地圖</a>' +
        '<h1>練習本<span class="k">れんしゅう</span></h1>' +
        '<p class="goal">' + (n

             '<button class="btn2" id="nbPlay">▶ 播放全部</button>' +

               '<button data-dir="jp2zh" class="'+(cardDir==='jp2zh'?'on':'')+'" aria-label="題目出日文，答中文">日→中</button>' +
               '<button data-dir="zh2jp" class="'+(cardDir==='zh2jp'?'on':'')+'" aria-label="題目出中文，答日文">中→日</button>' +
             '</div>' +
             '<button class="btn2 pri" id="nbStart">開始練習</button>' +
           '</div>' : '') +

    drawNotebook();

  function drawNotebook(){
    var body = $('#notebody'); if (!body) return;
    noteRun = null;
    stopAllPlay();
    if (!NB.items.length){
      body.innerHTML = '<p class="secnote">還沒有收藏的字。到任何一課的「單字」段、「詞語總表」或「順序表」，按字旁邊的 ☆ 就會加入這裡。</p>';
      return;
    }
    body.innerHTML = NB.items.map(function(x, k){
      var au = x.audio || audioFor(x.id, 'v' + x.vi);
      return '<div class="nrow">' +
        '<div class="nk"><b>' + esc(x.kanji || x.kana) + '</b>' +
          (x.kanji ? '<span>' + esc(x.kana) + '</span>' : '') + '</div>' +
        '<div class="nz"><span class="vzh">' + esc(x.zh) + '</span>' +
          (x.pos ? '<span class="pos">' + esc(x.pos) + '</span>' : '') + '</div>' +
        '<div class="nl">' + esc(x.src || x.id) + '</div>' +
        '<button class="spk" data-say="' + esc(x.kana) + '"' +
          (au ? ' data-audio="' + esc(au) + '"' : '') + ' aria-label="播放發音">' + SPK + '</button>' +
        '<button class="rm" data-rm="' + k + '" aria-label="移出練習本">✕</button>' +
      '</div>';
    }).join('');
    bindSpeakers(body);
    if (!body.dataset.rm){
      body.dataset.rm = '1';
      body.addEventListener('click', function(e){
        var b = e.target.closest('.rm'); if (!b) return;
        var k = +b.getAttribute('data-rm');
        if (!NB.items[k]) return;
        NB.items.splice(k, 1); saveNB();
        toast('已移出練習本');
        renderNotebook();
      });
    }
  }
  function startNoteCards(pool){
    stopAudio();
    noteRun = { deck: shuffle(pool).slice(0, Math.min(10, pool.length)), i:0, ok:0, miss:[], dir: cardDir };
    renderNoteCards();
  }
  function renderNoteCards(){
    var body = $('#notebody'), r = noteRun;
    if (!body || !r) return;
    if (r.i >= r.deck.length) return renderNoteSummary();
    var x = r.deck[r.i];
    var jp = x.kanji || x.kana;
    var front = r.dir === 'jp2zh' ? jp : x.zh;
    var sub = (r.dir === 'jp2zh' && x.kanji) ? x.kana : '';
    var back = r.dir === 'jp2zh' ? x.zh : (x.kanji ? x.kanji + '　' + x.kana : x.kana);
    var au = x.audio || audioFor(x.id, 'v' + x.vi);

    body.innerHTML =
      '<div class="cardmeta nmeta"><span>練習本 · 第 ' + (r.i + 1) + ' ／ ' + r.deck.length + ' 題 · ' +
        (r.dir === 'jp2zh' ? '日→中' : '中→日') + '</span>' +
        '<button class="nquit" id="nbQuit" aria-label="離開練習，回到練習本">✕ 離開練習</button></div>' +
      '<div class="fcard" id="fcard" style="position:relative">' +
        '<button class="spk cardspk" data-say="' + esc(x.kana) + '"' +
          (au ? ' data-audio="' + esc(au) + '"' : '') +
          ' aria-label="播放發音" style="position:absolute;margin:0;right:14px;top:14px">' + SPK + '</button>' +
        '<div class="fq">' + esc(front) + '</div>' +
        (sub ? '<div class="fsub">' + esc(sub) + '</div>' : '') +
        '<div class="fa hide" id="fback">' + esc(back) + '</div>' +
      '</div>' +
      '<div class="cbtns">' +
        '<button class="btn2 pri" id="reveal">看答案</button>' +
        '<button class="btn2 b-ok" id="know" style="display:none">記得</button>' +
        '<button class="btn2 b-no" id="dunno" style="display:none">不記得</button>' +
      '</div>' +
      '<p class="secnote" style="text-align:center">不記得的字會同時收入錯題簿，並留在練習本。</p>';

    bindSpeakers(body);
    var quit = $('#nbQuit');
    if (quit) quit.addEventListener('click', function(){ stopAudio(); drawNotebook(); });
    var fcard = $('#fcard');
    function reveal(){
      $('#fback').classList.remove('hide');
      $('#reveal').style.display = 'none';
      $('#know').style.display = '';
      $('#dunno').style.display = '';
    }
    fcard.addEventListener('click', function(e){
      if (e.target.closest('.spk')) return;
      reveal();
    });
    $('#reveal').addEventListener('click', reveal);
    $('#know').addEventListener('click', function(){ r.ok++; r.i++; renderNoteCards(); });
    $('#dunno').addEventListener('click', function(){
      r.miss.push(x);
      addMistake({ key:x.id + ':w:' + x.kana, kind:'word', prompt:jp, answer:x.zh, sub:x.kana });
      r.i++; renderNoteCards();
    });
  }
  function renderNoteSummary(){
    var r = noteRun;
    var missed = r.miss.map(function(x){ return '<span>' + esc(x.kanji || x.kana) + '</span>'; }).join('');
    $('#notebody').innerHTML =

        '<div class="big">' + r.ok + '<small> ／ ' + r.deck.length + '</small></div>' +

          (r.miss.length ? '，其餘放進錯題簿。' : '，全部記得。') + '</p>' +

          (r.miss.length ? '<button class="btn2" id="nbRetry">重練不記得的</button>' : '') +

          '<button class="btn2" id="nbBack">回練習本</button>' +

      '</div>';
    if (r.miss.length) $('#nbRetry').addEventListener('click', function(){ startNoteCards(r.miss.slice()); });
    $('#nbAgain').addEventListener('click', function(){ startNoteCards(NB.items); });
    $('#nbBack').addEventListener('click', function(){ drawNotebook(); });
  }


  /* ---------- 階段測驗（依 JLPT 題型編排，選擇題） ---------- */
  var EXKEY = 'ngs-exam-v1';
  var EXAM_READY = { 1: true, 2: true, 3: true, 4: true };   /* 已編好題目的階段；沒有的階段顯示「準備中」 */
  var EX = (function(){
    try{ var o = JSON.parse(localStorage.getItem(EXKEY) || 'null'); if (o && typeof o === 'object') return o; }catch(e){}
    return { v:1, stages:{} };
  })();
  function saveExam(){ try{ localStorage.setItem(EXKEY, JSON.stringify(EX)); }catch(e){} }
  function examBest(stage){ return (EX.stages || {})[stage] || null; }
  var EXCACHE = {}, exRun = null;

  function loadExam(stage){
    if (EXCACHE[stage]) return Promise.resolve(EXCACHE[stage]);
    return getJSON('data/exam-' + stage + '.json').then(function(d){ EXCACHE[stage] = d; return d; });
  }

  function renderExam(stage){
    stopAudio();
    app.innerHTML = '<div class="err">載入測驗…</div>';
    loadExam(stage).then(function(d){ examIntro(d); }).catch(function(){
      app.innerHTML = '<p class="note">第 ' + stage + ' 階段的測驗還未編好。</p>' +
        '<p style="margin-top:14px"><a class="back" href="#/">← 回課程地圖</a></p>';
    });
  }

  function examIntro(d){
    var best = examBest(d.stage);
    var parts = d.parts.map(function(p){
      var n = d.items.filter(function(i){ return i.part === p.key; }).length;
      return '<div class="expart"><b>' + esc(p.label) + '</b>' +
             '<span class="n">' + n + ' 題<i>約 ' + p.minutes + ' 分 · ' + esc(p.note) + '</i></span></div>';
    }).join('');
    app.innerHTML =
      '<a class="back" href="#/" style="display:inline-block;margin:8px 0 12px">← 課程地圖</a>' +
      '<div class="exhd"><p class="eyebrow">' + esc(d.level) + ' · 第 ' + d.stage + ' 階段</p>' +
        '<h1>階段測驗<span>' + d.items.length + ' 題 · 約 ' +
          d.parts.reduce(function(s,p){ return s + p.minutes; }, 0) + ' 分鐘</span></h1>' +
        '<p class="goal">' + esc(d.note) + '</p></div>' +
      '<div class="exparts">' + parts + '</div>' +
      (best ? '<p class="secnote" style="margin-top:14px">最高 ' + best.best + ' ／ ' + best.total +
        ' 題 · 已做 ' + best.n + ' 次</p>' : '') +
      '<div class="row2" style="margin-top:16px"><button class="cta" id="exStart">開始測驗</button></div>' +
      '<p class="secnote" style="margin-top:14px">合格線：總分 60% 以上，而且每一部分 40% 以上。中途可以離開，答案不會保存。</p>';
    $('#exStart').addEventListener('click', function(){ startExam(d); });
  }

  /* 每次作答都把選項打亂：題庫的答案次序不會被記住，也避免「答案永遠係 ①」 */
  function shuffleItem(it){
    var idx = it.options.map(function(_, i){ return i; });
    for (var i = idx.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    var out = {}, k;
    for (k in it){ if (Object.prototype.hasOwnProperty.call(it, k)) out[k] = it[k]; }
    out.options = idx.map(function(i){ return it.options[i]; });
    out.answer = idx.indexOf(it.answer);
    if (it.order) out.order = it.order.map(function(oi){ return idx.indexOf(oi); });
    return out;
  }

  function startExam(d){
    var items = d.items.map(shuffleItem);
    exRun = { d: d, items: items, i: 0, ans: items.map(function(){ return -1; }) };
    examQ();
  }

  function examAnswered(){
    return exRun.ans.filter(function(a){ return a >= 0; }).length;
  }

  function examQ(){
    var d = exRun.d, items = exRun.items, it = items[exRun.i];
    var part = d.parts.filter(function(p){ return p.key === it.part; })[0] || { label: it.part };
    var answered = examAnswered();
    var html =
      '<a class="back" href="#/exam/' + d.stage + '" id="exQuit" style="display:inline-block;margin:8px 0 4px">← 離開測驗</a>' +
      '<div class="exbar"><span>' + esc(part.label) + ' · ' + esc(it.kind) + '</span>' +
        '<span>第 ' + (exRun.i + 1) + ' ／ ' + items.length + ' 題 · 已答 ' + answered + '</span></div>' +
      '<div class="exprog"><i id="exbar" style="width:' + Math.round(answered / items.length * 100) + '%"></i></div>' +
      '<div class="qcard">' +
        (it.passage ? '<div class="expass">' + esc(it.passage) + '</div>' : '') +
        '<div class="exq">' + esc(it.q) + '</div>' +
        (it.kind === '文の組み立て'
          ? '<div class="exslots"><span>①</span><span>②</span><span class="star">★</span><span>④</span></div>' +
            '<p class="exhint">把下面四個片段排成一句通順的日文，再選出放在 ★（第三格）的那一片。</p>'
          : '') +
        (it.audio ? '<div><button class="exaudio" id="exPlay">▶ 播放（可重播）</button></div>' : '') +
        '<div class="exopts">' + it.options.map(function(o, k){
          return '<button class="exopt' + (exRun.ans[exRun.i] === k ? ' on' : '') + '" data-k="' + k + '">' +
                   '<span class="k">' + '①②③④'.charAt(k) + '</span><span>' + esc(o) + '</span></button>';
        }).join('') + '</div>' +
      '</div>' +
      '<div class="exnav">' +
        (exRun.i > 0 ? '<button class="btn2" id="exPrev">← 上一題</button>' : '') +
        '<button class="btn2 pri" id="exNext">' + (exRun.i === items.length - 1 ? '交卷 →' : '下一題 →') + '</button>' +
      '</div>';
    app.innerHTML = html;

    if (it.audio){
      $('#exPlay').addEventListener('click', function(){
        playFile(it.audio, null, this);
      });
    }
    Array.prototype.forEach.call($$('.exopt'), function(b){
      b.addEventListener('click', function(){
        exRun.ans[exRun.i] = +b.dataset.k;
        Array.prototype.forEach.call($$('.exopt'), function(x){ x.classList.toggle('on', x === b); });
        var a = examAnswered();
        var pr = $('#exbar'); if (pr) pr.style.width = Math.round(a / items.length * 100) + '%';
        var sp = $('.exbar span:last-child');
        if (sp) sp.textContent = '第 ' + (exRun.i + 1) + ' ／ ' + items.length + ' 題 · 已答 ' + a;
      });
    });
    $('#exNext').addEventListener('click', function(){
      var last = exRun.i === items.length - 1;
      if (!last){ exRun.i++; examQ(); window.scrollTo(0, 0); return; }
      var left = items.length - examAnswered();
      if (left > 0 && !confirm('還有 ' + left + ' 題未答，仍要交卷嗎？')) return;
      examResult();
    });
    var pv = $('#exPrev');
    if (pv) pv.addEventListener('click', function(){ exRun.i--; examQ(); window.scrollTo(0, 0); });
  }


  function examResult(){
    var d = exRun.d, items = exRun.items;
    var per = {};
    d.parts.forEach(function(p){ per[p.key] = { n:0, ok:0, label:p.label }; });
    var score = 0;
    items.forEach(function(it, k){
      per[it.part].n++;
      if (exRun.ans[k] === it.answer){ per[it.part].ok++; score++; }
    });
    var total = items.length;
    var pct = Math.round(score / total * 100);
    var allParts = d.parts.every(function(p){ return per[p.key].ok / per[p.key].n >= 0.4; });
    var pass = pct >= 60 && allParts;

    /* 記錄最高分與次數 */
    EX.stages = EX.stages || {};
    var st = EX.stages[d.stage] || { best:0, n:0, total:total };
    st.n = (st.n || 0) + 1;
    st.total = total;
    st.at = Date.now();
    if (score > (st.best || 0)) st.best = score;
    st.last = { score:score, parts:{} };
    d.parts.forEach(function(p){ st.last.parts[p.key] = per[p.key].ok; });
    EX.stages[d.stage] = st;
    saveExam();

    /* 錯的題目入錯題簿 */
    items.forEach(function(it, k){
      if (exRun.ans[k] !== it.answer){
        addMistake({ key:'ex' + d.stage + ':' + it.id, kind:'exam',
          prompt: it.q.length > 40 ? it.q.slice(0, 40) + '…' : it.q,
          answer: it.options[it.answer], sub: it.kind });
      }
    });

    var rows = d.parts.map(function(p){
      var x = per[p.key], pc = Math.round(x.ok / x.n * 100);
      return '<div class="partrow"><span class="lbl">' + esc(x.label) + '</span>' +
             '<span class="pb"><i style="width:' + pc + '%"></i></span>' +
             '<span class="sc">' + x.ok + '/' + x.n + '</span></div>';
    }).join('');

    var review = items.map(function(it, k){
      var mine = exRun.ans[k], right = mine === it.answer;
      return '<div class="excard">' +
        '<div class="h"><b class="' + (right ? 'ok' : '') + '">' + (right ? '○' : '×') + '</b>' +
          '<span>問 ' + (k + 1) + ' · ' + esc(it.kind) + '</span></div>' +
        '<div class="q">' + esc(it.q) + '</div>' +
        '<div class="a">正解：' + esc(it.options[it.answer]) + '</div>' +
        (right ? '' : '<div class="w">你的答案：' + (mine >= 0 ? esc(it.options[mine]) : '未答') + '</div>') +
        '<div class="w">' + esc(it.why) + '</div>' +
        (it.script ? '<div class="w">音檔原文：' + esc(it.script) + '</div>' : '') +
      '</div>';
    }).join('');

    app.innerHTML =
      '<a class="back" href="#/exam/' + d.stage + '" style="display:inline-block;margin:8px 0 12px">← 測驗首頁</a>' +
      '<div class="sum exsum">' +
        '<div class="big">' + score + '<small> ／ ' + total + '</small></div>' +
        '<p class="verdict" style="margin-top:6px;font-size:14px">' +
          (pass ? '合格（' + pct + '%）' : (pct >= 60 ? '總分夠，但有一部分的得分低於 40%' : '不合格（' + pct + '%）')) +
        '</p>' +
        rows +
        '<p class="secnote" style="margin-top:14px">最高分 ' + st.best + ' ／ ' + total + ' · 這是第 ' + st.n + ' 次作答</p>' +
      '</div>' +
      '<div class="row2" style="margin-top:16px">' +
        '<button class="btn2" id="exAgain">再做一次</button>' +
        '<a class="btn2" href="#/" style="text-decoration:none">回課程地圖</a>' +
      '</div>' +
      '<div class="exrev"><h3>逐題檢討（' + total + ' 題）</h3>' + review + '</div>';

    $('#exAgain').addEventListener('click', function(){ startExam(d); window.scrollTo(0,0); });
    window.scrollTo(0, 0);
  }

  /* 換頁一律回到頂部：由課程地圖（可能已捲到下面）點入某一課，
     要即刻見到「第 X 階段 · 第 N 課 · 級別 · 進度」那行，而不是停在中間。
     只有「課程地圖」例外：記住離開時的捲動位置，回來時復原。 */
  var VIEW = 'map', MAPY = 0;
  function route(){
    stopAudio();
    if (VIEW === 'map') MAPY = window.pageYOffset || 0;
    var h = (location.hash || '#/').replace(/^#/, '');
    var sm = h.match(/^\/seq(?:\/([a-z0-9-]+))?/);
    if (sm){ VIEW = 'seq'; stopAudio(); renderSeq(sm[1] || null); return; }
    if (h === '/note'){ VIEW = 'note'; stopAudio(); window.scrollTo(0, 0); renderNotebook(); return; }
    var em = h.match(/^\/exam\/(\d+)/);
    if (em){ VIEW = 'exam'; renderExam(+em[1]); return; }
    var am = h.match(/^\/all\/(vocab|grammar)/);
    if (am){ VIEW = 'all'; stopAudio(); window.scrollTo(0, 0); renderAll(am[1]); return; }
    var vf = h.match(/^\/all\/verbs\/forms\/(godan|ichidan|irregular)/);
    if (vf){ VIEW = 'wt'; stopAudio(); window.scrollTo(0, 0); renderVerbForms(vf[1]); return; }
    var wm = h.match(/^\/all\/(verbs|adjs)/);
    if (h === '/all/adjs/forms'){ VIEW = 'wt'; stopAudio(); window.scrollTo(0, 0); renderAdjForms(); return; }
    if (wm){ VIEW = 'wt'; stopAudio(); window.scrollTo(0, 0); renderWordTable(wm[1]); return; }
    var m = h.match(/^\/l\/(L\d{2})(?:\/([a-z]+))?/);
    if (m && lessons[m[1]]){
      VIEW = 'lesson';
      var tab = m[2] && TABS.some(function(t){ return t[0] === m[2]; }) ? m[2] : 'patterns';
      P.last = m[1]; saveProgress();
      document.title = '第' + lessons[m[1]].no + '課 ' + lessons[m[1]].title + ' · 日語階梯';
      renderLesson(lessons[m[1]], tab);
      window.scrollTo(0, 0);
      return;
    }
    document.title = '日語階梯 · nihongo-step';
    VIEW = 'map';
    renderMap();
    if (MAPY) window.scrollTo(0, MAPY);
  }

  /* ---------- 預先製作的人聲檔（data/audio.json 有記錄的句子優先用音檔） ---------- */
  var AUDIO = {};
  var WT = null;
  var KANJI_READ = {};   // 漢字 → 假名讀音（由課程 ja／kana 對照離線產生）
  var VAD_SILENCE_MS = 2500;   // 講完之後要靜幾耐才自動停止收音（句子有標點，停頓正常）
  var VAD_SPEAK_RMS = 0.02;    // 音量門檻：低於此值當作靜音
  function audioFor(id, key){
    var m = AUDIO[id];
    return (m && m[key]) || null;
  }
  /* 動詞表／形容詞表有自己的音檔版本，避免為了它們把全部音檔重新下載 */
  function auVer(url){
    // 句子（會話・句型・文法・聽力）與動詞／形容詞表各自一套版本號，
    // 改句子讀音時不用連 822 個單字音檔（約 60MB）一齊重下。
    if (/audio\/(verb|adj)\//.test(url)) return 't1';
    /* 動詞詳細表（audio/verbform/）自成一套版本號 */
    if (/audio\/verbform\//.test(url)) return 'vf1';
    /* 形容詞變化頁（audio/adjform/）自成一套版本號 */
    if (/audio\/adjform\//.test(url)) return 'f1';
    /* 順序表音檔（audio/seq/）剪過靜音、內容變過，版本一齊推，免得手機用舊快取 */
    if (!/\/L\d{2}-v\d+\.mp3$/.test(url)) return 'e11';
    return AUDIO.v || 1;
  }
  function playFile(url, onend, el, rate){
    /* 不呼叫 stopAudio：連續播放時要保留 PLAYSEQ 狀態 */
    if (curAudio){ try{ curAudio.pause(); }catch(e){} curAudio = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    try{
      /* 音檔加了版本查詢字串，避免瀏覽器沿用舊快取 */
      var a = new Audio(url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + auVer(url));
      /* 一律原速播放預製人聲 */
      a.playbackRate = (rate && rate > 0) ? rate : 1;
      curAudio = a;
      if (el) el.classList.add('playing');
      a.onended = function(){
        if (el) el.classList.remove('playing');
        if (curAudio === a) curAudio = null;
        if (onend) onend();
      };
      a.onerror = function(){
        if (el) el.classList.remove('playing');
        if (curAudio === a) curAudio = null;
        if (onend) onend();
      };
      var pr = a.play();
      if (pr && pr.catch) pr.catch(function(){});
      return true;
    }catch(e){ return false; }
  }

  function boot(){
    getJSON('data/audio.json').then(function(m){ AUDIO = m || {}; }).catch(function(){});
    getJSON('data/wordtables.json').then(function(m){ WT = m || null; }).catch(function(){});
    getJSON('data/verbforms.json').then(function(m){ VERBFORMS = m || null; }).catch(function(){});
    getJSON('data/kanji-readings.json').then(function(m){ KANJI_READ = (m && m.dict) || {}; }).catch(function(){});
    getJSON('data/course.json').then(function(c){
      course = c;
      var ids = availableLessons().map(function(l){ return l.id; });
      return Promise.all(ids.map(function(id){
        return getJSON('data/lesson-' + id + '.json').then(function(j){ lessons[id] = j; })
          .catch(function(e){ console.warn('lesson load failed', id, e); });
      }));
    }).then(function(){
      route();
    }).catch(function(e){
      app.innerHTML = '<div class="err">課程資料載入失敗。<br><small>'+esc(e.message)+'</small></div>';
    });

    window.addEventListener('hashchange', route);
  }

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(function(reg){
        reg.update();
      }).catch(function(){});
    });
  }

  boot();
})();
</script>
