<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c3e6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日語階梯">
<title>五十音 · 日語階梯</title>

<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .backhome{display:inline-flex; align-items:center; flex:0 0 auto;
    text-decoration:none; color:var(--ink-soft); font-size:16px; line-height:1;
    padding:8px 6px; margin-left:-4px}
  .backhome span{display:none}
  /* 加入返回地圖後 header 變窄：收細字級、按鈕不准換行 */
  header .brand, header .hactions{flex-wrap:nowrap; min-width:0}
  header .brand{gap:6px}
  header .brand .jp{font-size:18px; white-space:nowrap}
  header .brand .sub{font-size:10.5px; white-space:nowrap}
  header .brand .ver{display:none}
  header .reset{white-space:nowrap; padding:7px 10px; font-size:12px}
  header .iconbtn{flex:0 0 auto}
  @media (max-width:360px){
    header .brand .sub{display:none}
  }
  .backhome:active{color:var(--ink)}
  :root{
    --washi:#f4efe6; --washi-2:#ece4d6; --ink:#26221d; --ink-soft:#6b6357;
    --card:#fffdf8; --indigo:#2c3e6b; --indigo-2:#3a4f86; --vermilion:#c8402f;
    --green:#2e8b57; --green-bg:#e6f5ec; --red:#d64541; --red-bg:#fbe9e8;
    --line:#e4dccd; --shadow:0 10px 40px rgba(60,48,28,.12), 0 2px 8px rgba(60,48,28,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Noto Sans JP","Hiragino Sans","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -10%, #efe6d3 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #e9e1d1 0%, transparent 55%),
      var(--washi);
    min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }
  .app{width:100%; max-width:520px; display:flex; flex-direction:column; gap:14px; flex:0 0 auto;}

  header{display:flex; align-items:center; justify-content:space-between; padding:0 4px;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .jp{font-family:"Noto Serif JP",serif; font-weight:700; font-size:22px; letter-spacing:.06em;}
  .brand .sub{font-size:12px; color:var(--ink-soft); letter-spacing:.14em; text-transform:uppercase;}
  .brand .ver{font-size:10px; color:#c3b9a6; letter-spacing:.08em; align-self:center;}
  .reset{border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    font-size:12.5px; padding:8px 13px; border-radius:999px; cursor:pointer; transition:.18s; font-family:inherit;}
  .reset:hover{color:var(--vermilion); border-color:#e2c5bc;}
  .hactions{display:flex; align-items:center; gap:8px;}

  /* 假名表（溫習） */
  .chart{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:14px;}
  .chart[hidden]{display:none;}
  .chart-bg{position:absolute; inset:0; background:rgba(38,34,29,.42);}
  .chart-card{position:relative; width:min(560px,100%); max-height:86vh; background:var(--card);
    border-radius:20px; box-shadow:0 24px 60px rgba(38,34,29,.3); display:flex; flex-direction:column; overflow:hidden;}
  .chart-head{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 15px; border-bottom:1px solid var(--line);}
  .chart-head h2{font-size:14.5px; letter-spacing:.1em; font-weight:700;}
  .chart-head .sub{font-size:10.5px; color:#b6ac99; letter-spacing:.1em;}
  .chart-close{border:1px solid var(--line); background:var(--card); color:var(--ink-soft); width:30px; height:30px;
    border-radius:999px; cursor:pointer; font-size:14px; line-height:1;}
  .chart-close:hover{color:var(--vermilion); border-color:#e2c5bc;}
  .chart-tools{padding:9px 14px; display:flex; justify-content:center; align-items:center; gap:8px; border-bottom:1px solid var(--line);}
  .chart-play{border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-family:inherit;
    font-size:12px; letter-spacing:.04em; padding:7px 13px; border-radius:999px; cursor:pointer; transition:.15s;}
  .chart-play.stop{background:var(--indigo); border-color:var(--indigo); color:#fff;}
  .chart-seg{display:flex; gap:5px; background:#f4eee2; border:1px solid var(--line); border-radius:999px; padding:3px;}
  .chart-seg button{border:0; background:transparent; font-family:inherit; font-size:12px; letter-spacing:.04em;
    padding:6px 15px; border-radius:999px; color:var(--ink-soft); cursor:pointer; transition:.15s;}
  .chart-seg button.active{background:var(--card); color:var(--ink); font-weight:700; box-shadow:0 1px 4px rgba(60,48,28,.12);}
  .chart-body{overflow:auto; padding:12px 14px 18px; -webkit-overflow-scrolling:touch;}
  .chart-sec{margin-top:14px;}
  .chart-sec:first-child{margin-top:2px;}
  .chart-sec h3{font-size:11px; letter-spacing:.14em; color:var(--ink-soft); text-transform:uppercase; margin:0 0 7px 2px;}
  .kgrid{display:grid; gap:6px;}
  .kgrid.c5{grid-template-columns:repeat(5,1fr);}
  .kgrid.c3{grid-template-columns:repeat(3,1fr);}
  .kcell{display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 2px 5px;
    border:1px solid var(--line); border-radius:10px; background:#fffefb; cursor:pointer; font-family:inherit;
    transition:.12s; touch-action:manipulation;}
  .kcell:active,.kcell:focus-visible{border-color:var(--indigo);}
  .kcell b{font-family:"Noto Serif JP",serif; font-size:19px; font-weight:700; line-height:1.15; color:var(--ink);}
  .kcell i{font-style:normal; font-family:"Noto Serif JP",serif; font-size:12px; line-height:1.1; color:#9b9280;}
  .kcell span{font-size:9px; color:#c0b7a6; letter-spacing:.05em;}
  .kcell.blank{visibility:hidden;}
  .kcell.playing{border-color:var(--indigo); background:#d5dff3; box-shadow:0 0 0 2px rgba(44,62,107,.6);}
  .kcell.playing b{color:var(--indigo);}

  .mode{display:flex; background:var(--indigo); border-radius:15px; padding:5px; gap:5px;}
  .mode button{flex:1; border:0; background:transparent; color:#c7d0e8; font-family:inherit;
    font-size:12.5px; font-weight:600; padding:11px 1px; border-radius:11px; cursor:pointer; transition:.18s; white-space:nowrap;
    letter-spacing:.01em;}
  .mode button.active{background:var(--card); color:var(--indigo); box-shadow:0 2px 10px rgba(0,0,0,.18);}

  .modebar{display:flex; gap:8px; align-items:center;}
  .seg{display:flex; background:var(--washi-2); border-radius:14px; padding:4px; gap:4px; flex:1;}
  .seg button{flex:1; border:0; background:transparent; color:var(--ink-soft); font-family:inherit;
    font-size:14px; font-weight:500; padding:9px 6px; border-radius:10px; cursor:pointer; transition:.18s; white-space:nowrap;}
  .seg button.active{background:var(--card); color:var(--indigo); box-shadow:0 2px 8px rgba(60,48,28,.10); font-weight:700;}
  #scopeSeg button{font-size:13.5px; padding:9px 3px;}
  .badge{display:inline-block; min-width:17px; height:17px; line-height:17px; padding:0 5px; margin-left:4px;
    border-radius:999px; background:var(--vermilion); color:#fff; font-size:11px; font-weight:700; vertical-align:2px;}
  .badge[hidden]{display:none;}

  /* ── 錯題簿管理（底部 sheet）*/
  .sheet-wrap{position:fixed; inset:0; z-index:50;}
  .sheet-wrap[hidden]{display:none;}
  .sheet-bg{position:absolute; inset:0; background:rgba(38,34,29,.42);}
  .sheet{position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:520px;
    max-height:86vh; display:flex; flex-direction:column; background:var(--card);
    border-radius:22px 22px 0 0; box-shadow:0 -12px 40px rgba(40,32,20,.28);
    padding:18px 18px calc(16px + env(safe-area-inset-bottom)); animation:sheetIn .22s cubic-bezier(.2,.9,.3,1.1);}
  @keyframes sheetIn{from{transform:translate(-50%,20px); opacity:.5;} to{transform:translate(-50%,0); opacity:1;}}
  .sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex:0 0 auto;}
  .sheet-title{font-size:17px; font-weight:700; color:var(--indigo);}
  .sheet-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px; font-variant-numeric:tabular-nums;}
  .sheet-x{border:0; background:var(--washi-2); color:var(--ink-soft); width:32px; height:32px; border-radius:50%;
    font-size:13px; cursor:pointer; flex:0 0 auto; line-height:1;}
  .sheet-tools{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 10px; flex:0 0 auto;}
  .sheet-tools .mini{padding:7px 11px; font-size:12.5px;}
  .sheet-tools .mini.danger{color:var(--red); border-color:#eccfcb;}
  .sheet-tools .mini.on{background:var(--indigo); border-color:var(--indigo); color:#fff;}
  .sheet-list{overflow-y:auto; display:flex; flex-direction:column; gap:6px; min-height:64px; padding:2px;
    -webkit-overflow-scrolling:touch;}
  .sheet-empty{font-size:13px; color:var(--ink-soft); text-align:center; padding:22px 6px; line-height:1.6;}
  .witem{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line);
    border-radius:12px; background:#fffefb; cursor:pointer;}
  .witem.off{opacity:.55;}
  .wtick{width:26px; height:26px; flex:0 0 26px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    color:transparent; font-size:14px; font-weight:700; cursor:pointer; display:grid; place-items:center; padding:0;}
  .witem.on .wtick{background:var(--green); border-color:var(--green); color:#fff;}
  .wkana{font-family:"Noto Serif JP",serif; font-size:24px; font-weight:700; line-height:1;}
  .wrom{font-size:12.5px; color:var(--ink-soft); letter-spacing:.04em;}
  .wtag{margin-left:auto; font-size:11px; color:#b6ac99; letter-spacing:.06em;}
  .wdel{border:0; background:transparent; color:#c9bfae; font-size:13px; cursor:pointer; padding:5px 7px; border-radius:8px;}
  .wdel:hover{color:var(--red); background:var(--red-bg);}
  .sheet-add{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column;
    gap:8px; flex:0 1 auto; min-height:0;}
  .sheet-add[hidden]{display:none;}
  .add-hint{font-size:12px; color:var(--ink-soft);}
  .add-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; max-height:190px; overflow-y:auto; padding:2px;}
  .add-grid button{border:1.5px solid var(--line); background:#fffefb; border-radius:9px; aspect-ratio:1/1;
    font-family:"Noto Serif JP",serif; font-size:17px; font-weight:700; color:var(--ink); cursor:pointer; padding:0;}
  .add-grid button:hover{border-color:var(--indigo);}
  .sheet-foot{margin-top:14px; display:flex; gap:8px; flex:0 0 auto;}
  .sheet-foot .btn-main{flex:1; min-height:48px;}
  .sheet-foot .btn-main:disabled{opacity:.45; box-shadow:none; cursor:default;}

  .card{background:var(--card); border-radius:26px; box-shadow:var(--shadow); padding:24px 20px 22px;
    border:1px solid #f2ebdd; position:relative; overflow:hidden;}
  .card::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% -20%, rgba(44,62,107,.05), transparent 55%);}
  .panel{display:none; flex-direction:column; align-items:center; gap:6px; position:relative; z-index:1;}
  .panel.active{display:flex;}
  .type-label.hide{display:none;}
  .empty{display:flex; flex-direction:column; align-items:center; gap:10px; padding:34px 10px 30px; text-align:center;}
  .empty .ico{font-size:44px; line-height:1;}
  .empty .t{font-size:17px; font-weight:700; color:var(--indigo);}
  .empty .s{font-size:13.5px; color:var(--ink-soft); line-height:1.6; max-width:30ch;}
  .empty .btn-main{min-height:46px; margin-top:8px;}

  .type-label{font-size:12px; letter-spacing:.16em; color:var(--ink-soft); text-transform:uppercase; margin-top:2px;}
  .kana{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:700;
    font-size:150px; line-height:1; color:var(--ink); user-select:none;
    min-height:160px; display:flex; align-items:center;
    animation:pop .28s cubic-bezier(.2,.9,.3,1.4);}
  @keyframes pop{from{opacity:0; transform:scale(.8);} to{opacity:1; transform:scale(1);}}

  .input-row{width:100%; margin-top:12px; display:flex; gap:10px;}
  #answer, #speakInput{flex:1; min-width:0; font-family:inherit; font-size:20px; text-align:center;
    padding:15px 14px; border-radius:15px; border:2px solid var(--line); background:#fffefb;
    color:var(--ink); outline:none; transition:.18s; letter-spacing:.08em; font-weight:600;}
  #answer::placeholder, #speakInput::placeholder{color:#c3b9a6; font-weight:400; letter-spacing:.04em;}
  #answer:focus, #speakInput:focus{border-color:var(--indigo); box-shadow:0 0 0 4px rgba(44,62,107,.10);}
  #answer.correct, #speakInput.correct{border-color:var(--green); background:var(--green-bg); color:var(--green);}
  #answer.wrong, #speakInput.wrong{border-color:var(--red); background:var(--red-bg); color:var(--red);}
  .btn-main{border:0; border-radius:15px; padding:0 24px; font-family:inherit; font-size:16px; font-weight:700;
    background:var(--indigo); color:#fff; cursor:pointer; transition:.18s; white-space:nowrap;
    box-shadow:0 6px 18px rgba(44,62,107,.28);}
  .btn-main:hover{background:var(--indigo-2);}
  .btn-main.next{background:#4f4a42; box-shadow:0 6px 18px rgba(38,34,29,.22);}
  .btn-main.next.err{background:var(--red); box-shadow:0 6px 18px rgba(214,69,65,.28);}

  /* listen prompt */
  .prompt-wrap{display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0 2px;}
  .listen-prompt{width:140px; height:140px; border-radius:50%; cursor:pointer;
    background:linear-gradient(145deg,#eef1fb,#dfe6f7); border:2px solid #d5ddf2;
    display:grid; place-items:center; box-shadow:0 10px 30px rgba(44,62,107,.18); transition:.2s;}
  .listen-prompt:hover{transform:scale(1.03);}
  .listen-prompt:active{transform:scale(.96);}
  .listen-prompt .ico{font-size:58px; line-height:1; color:var(--indigo); display:grid; place-items:center;}
  .listen-prompt .ico svg{width:1em; height:1em; display:block;}
  .listen-prompt.playing{animation:ring .8s ease-out;}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(44,62,107,.30);} 100%{box-shadow:0 0 0 22px rgba(44,62,107,0);}}
  .prompt-hint{font-size:13.5px; color:var(--ink-soft);}
  .prompt-hint b{color:var(--indigo);}

  /* 拼音提示（可選） */
  .prompt-romaji{display:none; font-size:17px; font-weight:800; letter-spacing:.08em;
    color:var(--indigo); line-height:1.2; user-select:none;}
  .prompt-romaji.on{display:block; animation:romIn .18s ease-out;}
  .prompt-romaji .alt{font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--ink-soft); opacity:.85; margin-left:6px;}
  @keyframes romIn{from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:none;}}

  .pad{width:100%; margin-top:14px; display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
  .pad button{aspect-ratio:1/1; border:1.5px solid var(--line); background:#fffefb; border-radius:12px;
    font-family:"Noto Serif JP",serif; font-size:23px; font-weight:700; color:var(--ink); cursor:pointer; transition:.13s; padding:0;}
  .pad button:hover{border-color:var(--indigo);}
  .pad button:active{transform:scale(.93);}
  .pad button:disabled{cursor:default;}
  .pad button.right{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  .pad button.wrongtap{background:var(--red-bg); border-color:var(--red); color:var(--red);}
  .pad button.reveal{box-shadow:0 0 0 2.5px var(--green) inset; border-color:var(--green);}
  .pad button.dim{opacity:.4;}
  .pad button.long{font-size:16.5px; letter-spacing:-.03em;}
  .pad-label{grid-column:1/-1; font-size:12px; letter-spacing:.12em; color:var(--ink-soft); margin:6px 0 -2px; text-align:left;}
  .pad-sublabel{grid-column:1/-1; font-size:10.5px; letter-spacing:.14em; color:#b6ac99; margin:2px 0 -3px; text-align:left;}

  /* 聽聲：選字 draft + 濁點／拗音小字 */
  .draft-row{display:flex; align-items:center; gap:9px; margin-top:10px; min-height:34px; width:100%;}
  .draft-label{font-size:11px; letter-spacing:.12em; color:#b6ac99;}
  .draft-kana{font-family:"Noto Serif JP",serif; font-size:25px; font-weight:700; color:var(--indigo); line-height:1; margin-right:auto;}
  .draft-kana.empty{color:#d3cabb; font-weight:500;}
  .marks{display:flex; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  .marks[hidden]{display:none;}
  .marks button{min-width:50px; height:42px; border:1.5px solid var(--line); background:#fffefb; border-radius:11px;
    font-family:"Noto Serif JP",serif; font-size:19px; font-weight:700; color:var(--ink); cursor:pointer; transition:.13s; padding:0 6px;}
  .marks button:hover{border-color:var(--indigo);}
  .marks button:active{transform:scale(.94);}
  .marks button:disabled{opacity:.4; cursor:default;}
  #listenCheckBtn{padding:0 16px; min-height:42px; font-size:15px; flex:0 0 auto;}
  #listenCheckBtn:disabled{opacity:.45; box-shadow:none; cursor:default;}

  /* 聽聲：答案／重讀／慢放 貼住檢查掣，不使捲到鍵盤尾至見到 */
  .listen-ctl{display:flex; align-items:center; gap:8px; margin-top:8px; width:100%; flex-wrap:wrap;}
  .listen-ctl .feedback{margin-top:0; min-height:32px; flex:1 1 140px; justify-content:flex-start; text-align:left; gap:6px; font-size:14px;}
  .listen-ctl .feedback .answer-txt{font-size:17px;}
  .ctlbtn{border:1.5px solid var(--line); background:#fffefb; color:var(--ink-soft); font-family:inherit;
    font-size:13.5px; font-weight:700; letter-spacing:.04em; padding:0 12px; min-height:34px; border-radius:11px;
    cursor:pointer; transition:.13s; flex:0 0 auto;}
  .ctlbtn:hover{border-color:var(--indigo); color:var(--indigo);}
  .ctlbtn:active{transform:scale(.94);}
  .ctlbtn.playing{border-color:var(--indigo); color:var(--indigo);}
  #writeNextBtn{width:100%; margin-top:12px; min-height:46px;}

  /* write pad */
  .paper-wrap{width:100%; max-width:320px; margin-top:12px; border:1.5px solid var(--line); border-radius:16px; overflow:hidden; background-color:#fffefb;
    background-image:linear-gradient(to right,transparent calc(50% - .5px),#e8e0d0 calc(50% - .5px),#e8e0d0 calc(50% + .5px),transparent calc(50% + .5px)),
                     linear-gradient(to bottom,transparent calc(50% - .5px),#e8e0d0 calc(50% - .5px),#e8e0d0 calc(50% + .5px),transparent calc(50% + .5px));}
  #paper{display:block; width:100%; aspect-ratio:1/1; touch-action:none; cursor:crosshair;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  /* 寫字時不要選字反白、不要長按放大鏡、不要被系統叫出選單 */
  #writePanel, .paper-wrap{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{overscroll-behavior-y:contain;}
  /* 全站不准縮放：只留上下左右捲動，禁雙擊與雙指縮放 */
  /* manipulation = 可捲動、可點按，但唔會雙擊縮放；比 JS 攔 touchend 更安全（唔會食掉按鈕的 click） */
  html, body{touch-action:manipulation;}
  .writebar{width:100%; max-width:320px; display:flex; gap:8px; margin-top:12px;}
  .mini{border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-family:inherit;
    font-size:14px; padding:11px 14px; border-radius:12px; cursor:pointer; transition:.18s;}
  .mini:hover{color:var(--vermilion); border-color:#e2c5bc;}
  #revealBtn{flex:1; min-height:46px;}
  .reveal{width:100%; text-align:center; font-size:14px; color:var(--ink-soft); margin-top:12px; display:none;}
  .reveal.show{display:block;}
  .reveal b{font-family:"Noto Serif JP",serif; font-size:32px; color:var(--ink); margin:0 6px;}
  .speak-row{display:flex; gap:8px; width:100%; max-width:320px; margin:12px auto 0; align-items:stretch; justify-content:center;}
  .micbtn{display:flex; align-items:center; justify-content:center; gap:8px; flex:1;}
  .micbtn svg{width:19px; height:19px;}
  .micbtn.rec{background:var(--red); box-shadow:0 6px 18px rgba(214,69,65,.3); animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.72;}}
  .micbtn:disabled{opacity:.45; cursor:default; box-shadow:none;}
  .speak-row .ctlbtn{min-width:78px;}
  .speak-note{font-size:11.5px; color:#b6ac99; text-align:center; margin-top:10px; line-height:1.5; max-width:330px;}
  .speak-tip{font-size:11px; color:#c3b9a6; text-align:center; margin-top:14px; line-height:1.6; max-width:330px;}

  /* 手寫模式：收細寫字格、把喇叭與提示收成一行，讓題目與回饋同屏可見 */
  body.m-write .card{padding:16px 16px 14px;}
  body.m-write #poolHint{display:none;}
  body.m-write .prompt-wrap{flex-direction:row; gap:10px; padding:0;}
  body.m-write .listen-prompt{width:54px; height:54px;}
  body.m-write .listen-prompt .ico{font-size:24px;}
  body.m-write .prompt-hint{font-size:12.5px; text-align:left;}
  body.m-write .paper-wrap{max-width:182px; margin-top:6px;}
  body.m-write .writebar, body.m-write .cands, body.m-write .scorebar{max-width:188px; margin-top:6px;}
  body.m-write .writebar .mini{padding:9px 10px; font-size:13px;}
  body.m-write #revealBtn{min-height:40px; font-size:14px;}
  body.m-write .reveal{margin-top:4px;}
  body.m-write .reveal b{font-size:26px;}
  body.m-write .score{padding:10px 0;}
  body.m-write #writeNextBtn{min-height:42px; margin-top:4px;}

  /* 聽音選字：跟手寫一樣，喇叭與提示收成一行，一屏看到更多 */
  body.m-listen .card{padding:16px 16px 14px;}
  body.m-listen #poolHint{display:none;}
  body.m-listen .prompt-wrap{flex-direction:row; gap:10px; padding:0;}
  body.m-listen .listen-prompt{width:54px; height:54px;}
  body.m-listen .listen-prompt .ico{font-size:24px;}
  body.m-listen .prompt-hint{font-size:12.5px; text-align:left; flex:1 1 auto;}
  body.m-listen #slowListenBtn{flex:0 0 auto;}
  body.m-listen .draft-row{margin-top:8px; min-height:32px;}
  body.m-listen .draft-kana.empty{padding:0; display:inline-flex; align-items:center; min-height:26px;}
  body.m-listen .draft-row .btn-main{min-height:38px; padding:0 16px; font-size:14px;}
  body.m-listen .listen-ctl{margin-top:4px;}
  body.m-listen .listen-ctl .feedback{min-height:0;}
  body.m-listen .listen-prompt{box-shadow:0 0 0 7px rgba(44,62,107,.10);}
  body.m-listen .pad{gap:6px; margin-top:8px;}
  body.m-listen .pad-group{margin-top:6px;}
  body.m-listen .pad button{height:38px; font-size:19px;}

  .scorebar{width:100%; max-width:320px; display:none; gap:8px; margin-top:10px;}
  .scorebar.show{display:flex;}
  .score{flex:1; border-radius:13px; padding:13px 0; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer;}
  .score.ok{background:var(--green-bg); color:var(--green); border:1.5px solid var(--green);}
  .score.no{background:var(--red-bg); color:var(--red); border:1.5px solid var(--red);}

  .cands{width:100%; max-width:320px; display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;
    align-items:center; justify-content:center; min-height:0;}
  .cands .lbl{font-size:11px; color:#b6ac99; letter-spacing:.12em; margin-right:2px;}
  .cands .hint{font-size:12px; color:var(--ink-soft); text-align:center;}
  .cand{border:1.5px solid var(--line); background:#fffefb; border-radius:11px; min-width:46px; height:46px;
    touch-action:manipulation;
    font-family:"Noto Serif JP",serif; font-size:21px; font-weight:700; color:var(--ink); cursor:pointer;
    padding:0 9px; transition:.13s;}
  .cand:hover{border-color:var(--indigo);}
  .cand:active{transform:scale(.94);}
  .cand.right{border-color:var(--green); color:var(--green); background:var(--green-bg);}
  .cand.wrongtap{border-color:var(--red); color:var(--red); background:var(--red-bg);}
  .cand.sel{border-color:var(--indigo); color:var(--indigo); background:#eef1f8; box-shadow:0 0 0 2px rgba(44,62,107,.16);}

  .feedback{width:100%; margin-top:14px; min-height:40px; display:flex; align-items:center; justify-content:center;
    gap:9px; font-size:15px; font-weight:600; text-align:center; flex-wrap:wrap;
    opacity:0; transition:opacity .2s;}
  .feedback.show{opacity:1;}
  .feedback .dot{width:9px;height:9px;border-radius:50%;}
  .feedback.ok{color:var(--green);} .feedback.ok .dot{background:var(--green);}
  .feedback.no{color:var(--red);} .feedback.no .dot{background:var(--red);}
  .feedback .answer-txt{font-weight:700; letter-spacing:.05em; font-family:"Noto Serif JP",serif; font-size:18px;}
  .feedback .alt{color:var(--ink-soft); font-weight:400; font-size:13px;}
  .speak{border:1px solid var(--line); background:var(--card); border-radius:9px; width:34px;height:34px;
    display:grid;place-items:center; cursor:pointer; color:var(--indigo); font-size:15px;}
  .speak svg{width:17px; height:17px; display:block;}
  .speak.slow{font-size:12px; font-weight:700; font-family:inherit; letter-spacing:.02em;}

  .slowbtn{border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-family:inherit;
    font-size:12px; font-weight:600; padding:5px 11px; border-radius:999px; cursor:pointer;
    transition:.18s; white-space:nowrap; margin-left:auto;}
  .slowbtn.on{background:var(--indigo); border-color:var(--indigo); color:#fff; box-shadow:0 3px 10px rgba(44,62,107,.20);}

  .voicerow{display:flex; align-items:center; gap:6px; padding:0 4px; flex-wrap:wrap; row-gap:6px;}
  #romajiBtn{margin-left:0;}
  .poolhint{font-size:12px; color:var(--ink-soft); padding:0 16px 10px; letter-spacing:.02em; line-height:1.5;}
  .poolhint b{color:var(--indigo); font-weight:600;}
  .ghostbtn{border:1px solid var(--line); background:transparent; color:#b6ac99; font-family:inherit;
    font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; cursor:pointer; margin-left:6px;
    transition:.18s; vertical-align:middle;}
  .ghostbtn.on{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  .voicerow .vl{font-size:11px; color:#b6ac99; letter-spacing:.14em; margin-right:2px;}
  .vbtn{border:1px solid var(--line); background:transparent; color:var(--ink-soft); font-family:inherit;
    font-size:12px; font-weight:500; padding:5px 11px; border-radius:999px; cursor:pointer; transition:.18s;}
  .vbtn.active{background:var(--indigo); border-color:var(--indigo); color:#fff; font-weight:700;}

  /* 音量／靜音 */
  .iconbtn{display:grid; place-items:center; width:36px; height:36px; padding:0; border:1px solid var(--line);
    background:var(--card); border-radius:999px; color:var(--ink-soft); cursor:pointer; transition:.15s; flex:0 0 auto;}
  .iconbtn:hover{color:var(--indigo); border-color:var(--indigo);}
  .iconbtn svg{width:17px; height:17px; display:block;}
  .iconbtn .ico-off{display:none;}
  .iconbtn.muted{color:var(--red); border-color:var(--red);}
  .iconbtn.muted .ico-on{display:none;}
  .iconbtn.muted .ico-off{display:block;}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; background:var(--card);
    border-radius:18px; padding:14px 8px; box-shadow:0 4px 18px rgba(60,48,28,.06); border:1px solid #f2ebdd;}
  .stat{display:flex; flex-direction:column; align-items:center; gap:3px; position:relative;}
  .stat + .stat::before{content:""; position:absolute; left:0; top:14%; height:72%; width:1px; background:var(--line);}
  .stat .n{font-size:22px; font-weight:700; color:var(--indigo); font-variant-numeric:tabular-nums; line-height:1;}
  .stat .n.g{color:var(--green);} .stat .n.r{color:var(--red);} .stat .n.v{color:var(--vermilion);}
  .stat .l{font-size:11px; color:var(--ink-soft); letter-spacing:.04em;}

  footer{text-align:center; font-size:11.5px; color:#b6ac99; padding-top:2px; letter-spacing:.03em;}

  @media (max-width:400px){
    .kana{font-size:118px; min-height:128px;}
    .btn-main{padding:0 18px; font-size:15px;}
    .brand .jp{font-size:19px;}
    .pad{grid-template-columns:repeat(5,1fr); gap:7px;}
    .pad button{font-size:21px;}
    .listen-prompt{width:120px;height:120px;}
    .listen-prompt .ico{font-size:50px;}
    .mode button{font-size:12px; padding:10px 3px;}
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <a class="backhome" href="../" aria-label="返回課程地圖">←<span>地圖</span></a>
      <div class="brand"><span class="jp">五十音</span><span class="sub">Kana Dojo</span><span class="ver" id="verTag">v32</span></div>
      <div class="hactions">
        <button class="iconbtn" id="chartBtn" title="假名表（溫習用）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
        </button>
        <button class="reset" id="resetBtn" title="重設統計">↺ 重設</button>
        <button class="iconbtn" id="muteBtn" aria-pressed="false" title="靜音">
          <svg class="ico-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
      </div>
    </header>

    <div class="mode" id="modeSeg">
      <button data-mode="read" class="active" title="看字 → 輸入羅馬拼音">羅馬拼音</button>
      <button data-mode="listen" title="聽發音 → 從假名表選字">聽音選字</button>
      <button data-mode="write" title="聽發音 → 手寫">手寫</button>
      <button data-mode="speak" title="看字 → 用日文鍵盤打讀音（可用鍵盤語音輸入）">鍵盤輸入</button>
    </div>

    <div class="modebar">
      <div class="seg" id="scopeSeg">
        <button data-scope="hira" class="active">平假名</button>
        <button data-scope="kata">片假名</button>
        <button data-scope="both">隨機混合</button>
        <button data-scope="wrong">錯題簿<span class="badge" id="wrongBadge" hidden>0</span></button>
      </div>
    </div>

    <div class="voicerow">
      <span class="vl">發音</span>
      <button class="slowbtn" id="slowBtn" title="慢速讀音">慢讀</button>
      <button class="slowbtn" id="romajiBtn" title="在喇叭下面顯示拼音">拼音</button>
    </div>

    <div class="voicerow">
      <span class="vl" title="加入練習的字類">字類</span>
      <button class="vbtn" data-extra="daku" title="が ざ だ ば 等">濁音</button>
      <button class="vbtn" data-extra="hand" title="ぱ ぴ ぷ ぺ ぽ">半濁音</button>
      <button class="vbtn" data-extra="youon" title="きゃ しゃ ちゃ 等">拗音</button>
    </div>
    <div class="poolhint" id="poolHint"></div>

    <div class="card">
      <!-- READ PANEL -->
      <div class="panel active" id="readPanel">
        <div class="type-label" id="typeLabel">ひらがな（平假名）</div>
        <div class="kana" id="kana">あ</div>
        <div class="input-row">
          <input id="answer" type="text" inputmode="text" autocomplete="off" autocapitalize="none"
                 autocorrect="off" spellcheck="false" placeholder="輸入羅馬字拼音…">
          <button class="btn-main" id="checkBtn">檢查</button>
        </div>
        <div class="feedback" id="fbRead"></div>
      </div>

      <!-- LISTEN PANEL -->
      <div class="panel" id="listenPanel">
        <div class="type-label hide" id="listenType"></div>
        <div class="prompt-wrap">
          <button class="listen-prompt" id="listenPrompt" title="按再聽一次"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span></button>
          <div class="prompt-romaji" id="listenRomaji"></div>
          <div class="prompt-hint">聽發音 → 選回正確的<b>假名</b></div>
          <button class="ctlbtn" id="slowListenBtn" title="慢速再聽">慢放</button>
        </div>
        <div class="draft-row">
          <span class="draft-label">你選了</span>
          <span class="draft-kana empty" id="draftKana">—</span>
          <button class="btn-main" id="listenCheckBtn" disabled>檢查</button>
        </div>
        <div class="listen-ctl">
          <div class="feedback" id="fbListen"></div>
        </div>
        <div class="marks" id="marks" hidden></div>
        <div class="pad" id="pad"></div>
      </div>

      <!-- WRITE PANEL -->
      <div class="panel" id="writePanel">
        <div class="type-label hide" id="writeType"></div>
        <div class="prompt-wrap">
          <button class="listen-prompt" id="writePrompt" title="按再聽一次"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span></button>
          <div class="prompt-romaji" id="writeRomaji"></div>
          <div class="prompt-hint">聽發音 → <b>手寫</b>在格子中 <button class="ghostbtn" id="recogBtn">辨識</button></div>
        </div>
        <div class="paper-wrap"><canvas id="paper"></canvas></div>
        <div class="cands" id="cands"></div>
        <div class="writebar">
          <button class="mini" id="undoBtn">撤銷</button>
          <button class="mini" id="clearBtn">清除</button>
          <button class="btn-main" id="revealBtn">看答案</button>
        </div>
        <div class="scorebar" id="scorebar">
          <button class="score ok" id="okBtn">✓ 對</button>
          <button class="score no" id="noBtn">✗ 錯</button>
        </div>
        <div class="reveal" id="reveal"></div>
        <div class="feedback" id="fbWrite"></div>
        <button class="btn-main" id="writeNextBtn" hidden>下一題 →</button>
      </div>

      <!-- SPEAK PANEL（鍵盤輸入：看字打讀音，用日文鍵盤或其語音聽寫） -->
      <div class="panel" id="speakPanel">
        <div class="type-label hide" id="speakType"></div>
        <div class="kana" id="speakKana">あ</div>
        <div class="input-row">
          <input id="speakInput" type="text" inputmode="text" lang="ja" autocomplete="off"
                 autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="用日文鍵盤打讀音…">
          <button class="btn-main" id="speakCheck">檢查</button>
        </div>
        <div class="speak-row">
          <button class="ctlbtn" id="speakReplay">示範</button>
        </div>
        <div class="speak-note" id="speakNote"></div>
        <div class="speak-tip">用日文鍵盤輸入這個字的讀音（例：ぬ）。想用語音，可按鍵盤上的麥克風圖示，由系統聽寫轉成假名。</div>
        <div class="feedback" id="fbSpeak"></div>
      </div>

      <!-- 錯題簿空狀態 -->
      <div class="panel" id="emptyPanel">
        <div class="empty">
          <div class="ico"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M9 7h7"/></svg></div>
          <div class="t" id="emptyTitle">錯題簿目前是空的</div>
          <div class="s" id="emptySub">答錯的字會自動記錄（不會重複）；也可以自行加入字。</div>
          <button class="btn-main" id="emptyBtn">去練習</button>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="n v" id="statStreak">0</span><span class="l">連對</span></div>
      <div class="stat"><span class="n g" id="statCorrect">0</span><span class="l">答對</span></div>
      <div class="stat"><span class="n r" id="statWrong">0</span><span class="l">答錯</span></div>
      <div class="stat"><span class="n" id="statAcc">—</span><span class="l">正確率</span></div>
    </div>

    <footer>語音：Microsoft Nanami（預製 mp3） · 手寫辨識：本機筆順比對（模板 KanjiVG, CC BY-SA） · <span id="build">web-dev</span></footer>
  </div>

  <!-- 錯題簿管理 sheet -->
  <div class="sheet-wrap" id="wrongSheet" hidden>
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <div>
          <div class="sheet-title" id="sheetTitle">錯題簿</div>
          <div class="sheet-sub" id="sheetSub">0 個字</div>
        </div>
        <button class="sheet-x" id="sheetClose" aria-label="關閉">✕</button>
      </div>
      <div class="sheet-tools">
        <button class="mini" id="selAllBtn">全選</button>
        <button class="mini" id="selNoneBtn">全不選</button>
        <button class="mini" id="addModeBtn">＋ 加入字</button>
        <button class="mini danger" id="clearAllBtn">清空</button>
      </div>
      <div class="sheet-list" id="sheetList"></div>
      <div class="sheet-add" id="sheetAdd" hidden>
        <div class="add-hint">按字加入錯題簿</div>
        <div class="add-grid" id="addGrid"></div>
      </div>
      <div class="sheet-foot">
        <button class="btn-main" id="startPracticeBtn">開始練習</button>
      </div>
    </div>
  </div>

<div class="chart" id="chart" hidden>
  <div class="chart-bg" id="chartBg"></div>
  <div class="chart-card" role="dialog" aria-modal="true" aria-label="假名表">
    <div class="chart-head">
      <div>
        <h2>五十音表</h2>
        <div class="sub">按字聽發音</div>
      </div>
      <button class="chart-close" id="chartClose" aria-label="關閉">✕</button>
    </div>
    <div class="chart-tools">
      <div class="chart-seg" id="chartSeg">
        <button type="button" data-script="hira" class="active">平假名</button>
        <button type="button" data-script="kata">片假名</button>
      </div>
      <button type="button" class="chart-play" id="chartPlayAll">▶ 播放全部</button>
    </div>
    <div class="chart-body" id="chartBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ── 50音資料 ──────────────────────────────────────────────

    ['は','ha'],['ひ','hi'],['ふ','fu','hu'],['へ','he'],['ほ','ho'],

  const KATA = [

  // ── 錯題簿（localStorage 保存，同一個字不會重覆）──────────────
  function loadWrongBook(){

    if(hasExtra('hand'))  out.push(type==='hira' ? packHandHira : packHandKata);

  }

  const poolHintEl = $('poolHint');
  function updatePoolHint(){
    if(!poolHintEl) return;

    const cnt = {base:0, daku:0, hand:0, youon:0};
    pool.forEach(o => { const c = o.cls; if(c==='daku'||c==='hand'||c==='youon') cnt[c]++; else cnt.base++; });
    const parts = [];

    if(cnt.daku) parts.push('濁音 '+cnt.daku);
    if(cnt.hand) parts.push('半濁音 '+cnt.hand);
    if(cnt.youon) parts.push('拗音 '+cnt.youon);

      ? '（' + parts.join('・') + '）'
      : '（只有清音；按上面「字類」可加入濁音／半濁音／拗音）';

  let voiceMode = 'n';

  function ttsFallback(kana){

  function shuffleArr(a){

  }
  function newQuestion(silent){

  // ── 看字模式：核對羅馬字 ──────────────────────────────────

  // ── 手寫模式：自己對答案 ──────────────────────────────────
  function fitCanvas(){
    const w = paper.getBoundingClientRect().width || 300;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    paper.width = Math.round(w*dpr); paper.height = Math.round(w*dpr);
    ctx = paper.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#26221d';
    redraw();
  }
  function redraw(){
    if(!ctx) return;
    const w = paper.getBoundingClientRect().width || 300;
    ctx.clearRect(0,0,w,w);
    strokes.forEach(s=>{
      ctx.beginPath();
      s.forEach((p,i)=> i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
      if(s.length===1) ctx.lineTo(s[0][0]+.1, s[0][1]);
      ctx.stroke();
    });
  }
  function resetInk(){
    strokes=[]; drawing=false; curStroke=null; revealed=false; inkT0=0;
    clearTimeout(recogTimer); recogSeq++; cands=[];
    candsEl.innerHTML='';

  function scoreWrite(ok){
    if(mode!=='write' || !revealed || answered) return;
    answered=true;
    if(ok){ stats.correct++; stats.streak++;
      if(scope==='wrong') dropWrong(current);
      showFeedback(fbWrite, true, '答對了！', scope==='wrong'?'<span class="alt">已移出錯題簿</span>':'', current.k); }
    else { stats.wrong++; stats.streak=0; addWrong(current);

    updateStats();

  function showWriteNext(ok){

  // ── 手寫辨識：本機筆順比對（KanjiVG 模板 + DTW）──────────
  let TPL = null, TPL_N = 16, TPL_SQ = null, lastUnsure = false;
  // 逐軸壓縮版本：手寫字長闊比例同模板不同（寫得扁／寫得窄）時照樣對得上
  function squashSet(set){
    const out = {};
    Object.keys(set).forEach(k=>{
      const flat = set[k].flat();
      let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      flat.forEach(p=>{ if(p[0]<minX)minX=p[0]; if(p[0]>maxX)maxX=p[0]; if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1]; });
      const w=Math.max(maxX-minX,1e-6), h=Math.max(maxY-minY,1e-6);
      const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
      out[k] = set[k].map(s=>s.map(([x,y])=>[(x-cx)/w, (y-cy)/h]));
    });
    return out;
  }
  const tplReady = fetch('kana-templates.json?v=5')
    .then(r=>r.json())
    .then(j=>{ TPL = j.tpl; TPL_N = j.n || 16; TPL_SQ = squashSet(TPL); })
    .catch(()=>{ TPL = null; TPL_SQ = null; });

  function clearCands(msg){
    candsEl.innerHTML = msg ? '<span class="hint">'+msg+'</span>' : '';
  }
  function scheduleRecog(){
    clearTimeout(recogTimer);
    if(answered || mode!=='write' || overlayOpen()) return;
    if(!autoRecog){ clearCands('自動辨識已關閉 · 按「看答案」自行核對'); return; }
    recogTimer = setTimeout(recognize, 900);
  }
  // 等弧長重取樣成固定點數
  function resampleN(pts, n){
    if(pts.length < 2) return Array.from({length:n}, ()=>[pts[0][0], pts[0][1]]);
    const d = [0];
    for(let i=1;i<pts.length;i++) d.push(d[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    const total = d[d.length-1];
    if(!total) return Array.from({length:n}, ()=>[pts[0][0], pts[0][1]]);
    const out = [];
    let j = 0;
    for(let k=0;k<n;k++){
      const tgt = total * k / (n-1);
      while(j < d.length-2 && d[j+1] < tgt) j++;
      const seg = d[j+1]-d[j];
      const t = seg ? (tgt-d[j])/seg : 0;
      out.push([pts[j][0] + (pts[j+1][0]-pts[j][0])*t,
                pts[j][1] + (pts[j+1][1]-pts[j][1])*t]);
    }
    return out;
  }
  // 動態時間規整（banded）
  function dtw(a, b, band){
    const n = a.length, m = b.length;
    const INF = 1e9;
    const D = new Float64Array((n+1)*(m+1)).fill(INF);
    const W = m+1;
    D[0] = 0;
    for(let i=1;i<=n;i++){
      const lo = Math.max(1, i-(band+Math.abs(n-m)));
      const hi = Math.min(m, i+(band+Math.abs(n-m)));
      for(let j=lo;j<=hi;j++){
        const cost = Math.hypot(a[i-1][0]-b[j-1][0], a[i-1][1]-b[j-1][1]);
        const p = D[(i-1)*W+j], q = D[i*W+j-1], r = D[(i-1)*W+j-1];
        D[i*W+j] = cost + Math.min(p, q, r);
      }
    }
    return D[n*W+m] / Math.max(n, m);
  }
  function strokeDist(a, b){
    const a2 = resampleN(a, TPL_N), b2 = resampleN(b, TPL_N);
    const rev = b2.slice().reverse();
    return Math.min(dtw(a2, b2, 3), dtw(a2, rev, 3));
  }
  function scoreKana(user, tpl){
    const nu = user.length, nt = tpl.length;
    const pen = Math.abs(nu-nt) * 0.45;
    if(nu === nt){
      let d = 0;
      for(let i=0;i<nu;i++) d += strokeDist(user[i], tpl[i]);
      return d/nu + pen;
    }
    let d = 0, cnt = 0, i = 0, j = 0;
    while(i<nu && j<nt){
      if(nu-i > nt-j) i++;
      else if(nu-i < nt-j) j++;
      else { d += strokeDist(user[i], tpl[j]); cnt++; i++; j++; }
    }
    return (cnt ? d/cnt : 3) + pen;
  }
  // 正規化成單位方格（保持長寬比、置中）
  function normalizeInk(){
    const flat = strokes.flat();
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    flat.forEach(p=>{
      if(p[0]<minX) minX=p[0]; if(p[0]>maxX) maxX=p[0];
      if(p[1]<minY) minY=p[1]; if(p[1]>maxY) maxY=p[1];
    });
    const side = Math.max(maxX-minX, maxY-minY, 1);
    const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
    return strokes.map(s=>s.map(([x,y])=>[(x-cx)/side, (y-cy)/side]));
  }
  // 逐軸壓縮（手寫字比例同模板不同都用得）
  function normalizeInkSquash(){
    const flat = strokes.flat();
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    flat.forEach(p=>{
      if(p[0]<minX) minX=p[0]; if(p[0]>maxX) maxX=p[0];
      if(p[1]<minY) minY=p[1]; if(p[1]>maxY) maxY=p[1];
    });
    const w = Math.max(maxX-minX, 1), h = Math.max(maxY-minY, 1);
    const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
    return strokes.map(s=>s.map(([x,y])=>[(x-cx)/w, (y-cy)/h]));
  }
  function localRank(){
    if(!TPL) return [];
    const un = normalizeInk();
    const unS = TPL_SQ ? normalizeInkSquash() : null;
    const scored = [];
    pool.forEach(o=>{
      const t = TPL[o.k];
      if(!t) return;
      let d = scoreKana(un, t);
      if(unS && TPL_SQ[o.k]) d = Math.min(d, scoreKana(unS, TPL_SQ[o.k]));
      scored.push([d, o.k]);
    });
    scored.sort((a,b)=>a[0]-b[0]);
    if(!scored.length) return [];
    const best = scored[0][0];
    lastUnsure = best > 0.78;                        // 差距大 → 照出候選，但標明「不確定」
    const win = lastUnsure ? best*1.22 + 0.02 : best*1.6 + 0.03;
    return scored.filter(x=>x[0] <= win).slice(0, lastUnsure ? 4 : 6).map(x=>x[1]);
  }
  async function recognize(){
    if(mode!=='write' || answered || !strokes.length) return;
    const seq = ++recogSeq;
    if(!TPL){ clearCands('辨識模板載入中…'); return; }
    if(!TPL[current.k]){ clearCands('這個字尚無筆順範本 · 按「看答案」自行核對'); return; }
    clearCands('辨識中…');
    await new Promise(r=>requestAnimationFrame(r));
    const list = localRank();
    if(seq !== recogSeq || answered) return;
    cands = list;
    if(!cands.length){ clearCands('辨識不到，請寫大一點、清楚一點？'); return; }
    renderCands();
  }
  function renderCands(){
    candsEl.innerHTML = '';
    const lbl = document.createElement('span');
    lbl.className='lbl'; lbl.textContent = lastUnsure ? '不確定，請選回正確的' : '辨識到';
    candsEl.appendChild(lbl);
    cands.slice(0,8).forEach(ch=>{
      const b = document.createElement('button');
      b.className='cand'; b.textContent=ch;
      const fire = ()=>pickCand(ch, b);
      b.addEventListener('pointerup', fire);
      b.addEventListener('click', fire);
      candsEl.appendChild(b);
    });
  }
  function pickCand(ch, btn){
    // 選一次就當確定：即刻判對錯，不使再按掣
    if(mode!=='write' || answered || revealed) return;
    clearTimeout(recogTimer); recogSeq++; cands=[];
    if(btn) btn.classList.add('sel');
    checkPicked(ch);
  }
  function checkPicked(ch){
    if(mode!=='write' || answered) return;
    /* 手寫要分平假名／片假名：以前用 toHira() 兩邊都轉平假名再比，
       隨機混合時寫「あ」也會當成「ア」答對。這裡改成逐字完全相同才算對，
       但若只是字形種類寫錯，回饋會講清楚是寫錯平／片假名。 */
    const nfc = s => (s||'').normalize('NFC');
    const ok = nfc(ch) === nfc(current.k);
    const scriptSlip = !ok && toHira(ch) === toHira(current.k);
    answered = true;
    recogSeq++; clearTimeout(recogTimer);
    const sel = candsEl.querySelector('.cand.sel');
    if(sel){ sel.classList.remove('sel'); sel.classList.add(ok?'right':'wrongtap'); }
    candsEl.querySelectorAll('.cand').forEach(b=>{ b.disabled=true; });
    if(ok){
      stats.correct++; stats.streak++;
      if(scope==='wrong') dropWrong(current);
      showFeedback(fbWrite, true, '答對了！', scope==='wrong'?'<span class="alt">已移出錯題簿</span>':'', current.k);
    }else{
      stats.wrong++; stats.streak=0; addWrong(current);
      const slip = scriptSlip
        ? '<span class="alt">你寫了 '+typeName(current.type==='kata'?'hira':'kata')+' 的「'+ch+'」，這題要 '+typeName(current.type)+'。</span> '
        : '';
      showFeedback(fbWrite, false, '',
        slip + '你選了 '+ch+' · 正確是 <span class="answer-txt">'+current.k+'</span>', current.k);
    }
    updateStats();
    writebarEl.style.display='none';
    showAnswer();
    scorebar.classList.remove('show');
    showWriteNext(ok);
  }

  const inkPos = e => {
    const r=paper.getBoundingClientRect();
    return [e.clientX-r.left, e.clientY-r.top, Math.round(performance.now()-inkT0)];
  };
  paper.addEventListener('pointerdown', e=>{
    if(mode!=='write' || answered) return;
    e.preventDefault();
    try{ paper.setPointerCapture(e.pointerId); }catch(_){}
    if(!strokes.length) inkT0 = performance.now();
    // 一落筆就收起舊候選，避免半個字的錯誤結果干擾
    clearTimeout(recogTimer); recogSeq++; cands=[];
    if(candsEl.childElementCount) clearCands('');
    drawing=true; curStroke=[inkPos(e)]; strokes.push(curStroke); redraw();
  });
  paper.addEventListener('pointermove', e=>{
    if(!drawing) return;
    curStroke.push(inkPos(e)); redraw();
  });
  ['pointerup','pointercancel'].forEach(t=>paper.addEventListener(t, ()=>{
    if(!drawing) return;
    drawing=false; curStroke=null; scheduleRecog();
  }));
  window.addEventListener('resize', ()=>{ if(mode==='write') fitCanvas(); });

  /* iOS Safari 攔不住 <meta user-scalable=no>，要自己擋：
     - 雙指縮放（gesturestart/change）
     - 連按兩下放大
     - 長按選字／放大鏡（只有手寫模式才攔，其他模式仍可選字複製）
     縮放封鎖是全站生效。 */
  // 全站禁止縮放（不限手寫模式）
  ['gesturestart','gesturechange','gestureend'].forEach(t=>
    document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
  document.addEventListener('selectstart', e=>{ if(mode==='write') e.preventDefault(); });
  paper.addEventListener('contextmenu', e=>e.preventDefault());
  /* 雙擊縮放交給 CSS touch-action:manipulation 處理；
     唔再用 JS 攔 touchend —— iOS 上那樣會連「錄音」按鈕的點擊一併食掉，
     導致語音辨識 start() 拿不到使用者手勢而報 aborted。 */

  // ── 共用 feedback ─────────────────────────────────────────
  function showFeedback(el, ok, head, detailHtml, speakKana){
    el.className='feedback show '+(ok?'ok':'no');
    // 聽聲模式自己有「重讀／慢放」掣，不需要 feedback 內置的喇叭掣
    const withSpeak = el.id !== 'fbListen' && el.id !== 'fbSpeak';
    el.innerHTML =
      '<span class="dot"></span>' +
      (head?'<span>'+head+'</span>':'') +
      (detailHtml?'<span>'+detailHtml+'</span>':'') +
      (withSpeak
        ? '<button class="speak" data-sp="1" title="聽讀音">'+SPEAK_SVG+'</button>' +
          '<button class="speak slow" data-sp="2" title="慢速讀音">慢</button>'
        : '');
    if(withSpeak){
      el.querySelectorAll('.speak').forEach(b=>{
        b.onclick = ()=> speak(speakKana||current.k, b.dataset.sp==='2');
      });
    }
  }
  function updateStats(){
    $('statStreak').textContent=stats.streak;
    $('statCorrect').textContent=stats.correct;
    $('statWrong').textContent=stats.wrong;
    const t=stats.correct+stats.wrong;
    $('statAcc').textContent = t? Math.round(stats.correct/t*100)+'%':'—';
  }

  // ── 切換控制 ──────────────────────────────────────────────
  function setMode(m){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();  // 切模式前收鍵盤
    clearTimeout(promptTimer);              // 取消上一個模式排住的提示音

  // ── 鍵盤輸入模式：看字打讀音 ───────────────────────────────
  // 不再自建語音辨識：直接用日文鍵盤打假名；要語音就按鍵盤上的麥克風，
  // 由系統聽寫轉成假名（iOS／Android 內建），網站不收音、不下載模型。
  // 判定只認五十音表上有的音：「ねぇ」「目」「2」這類一律不當答案。
  const escH = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const kanaOnly = s => toHira(s||'').replace(/[^\u3041-\u3096]/g,'');
  // 取第一個音節：小字（ゃゅょゎぁぃぅぇぉ）跟前一個假名合成一個音
  const firstUnit = s => {
    const k = kanaOnly(s);
    if(!k) return '';
    return (/[ゃゅょゎぁぃぅぇぉ]/.test(k[1] || '')) ? k.slice(0,2) : k[0];
  };
  const inTable = k => !!ROMAJI[k];            // 五十音表上有的音才接受
  const normRom = s => (s||'').toLowerCase().replace(/wo/g,'o').replace(/zi/g,'ji').replace(/([aeiou])\1+/g,'$1');
  const VALID_ROM = new Set(Object.keys(BY_ROMAJI).map(normRom));   // 表上有的拼音才算輸入
  // 判定輸入：回傳 { status:'ok' | 'wrong' | 'empty', unit }
  function judgeTyped(text, kana){
    const raw = String(text||'').trim();
    if(!raw) return { status:'empty', unit:'' };
    const targetKana = toHira(kana);
    const targetRom = normRom(ROMAJI[targetKana] || ROMAJI[kana] || '');
    if(/^[a-z]+$/i.test(raw)){                            // 打羅馬拼音也接受
      const rom = normRom(raw);
      if(!VALID_ROM.has(rom)) return { status:'empty', unit:'' };   // 不是表上的拼音
      return { status: (targetRom && rom===targetRom) ? 'ok' : 'wrong', unit: raw.toLowerCase() };
    }
    const u = firstUnit(raw);
    if(!u || !inTable(u)) return { status:'empty', unit:'' };   // 表外的字／漢字：不判錯
    const ok = u===targetKana || (targetRom && normRom(ROMAJI[u])===targetRom);
    return { status: ok ? 'ok' : 'wrong', unit: u };
  }

  const chartEl=$('chart'), chartBody=$('chartBody'), chartBtn=$('chartBtn'), chartClose=$('chartClose'), chartBg=$('chartBg');
  const toKata = s => (s||'').replace(/[\u3041-\u3096]/g, c=>String.fromCharCode(c.charCodeAt(0)+0x60));
  const CHART_ROWS = [

  const chartPlayBtn = $('chartPlayAll');

  function nextChartStep(){
    if(!chartSeq) return;

    chartBody.querySelectorAll('.kcell.playing').forEach(b=>b.classList.remove('playing'));

    const url = VOICE_DIR[voiceMode] + chartCellAudio(c.dataset.k);
    const ready = chartBlobs.get(url);
    if(ready){
      playElement(ready, 1, c.dataset.k);          // 已預抓：即時由記憶體播放
    }else if(chartPending.has(url)){
      // 仲抓緊：等佢到（最多 3 秒）才播，避免用網絡 URL 播放時卡住／漏聲
      const want = c.dataset.k;
      let fired = false;
      const go = ()=>{ if(fired) return; fired = true; if(!chartSeq) return;
        playElement(chartBlobs.get(url) || url, 1, want); };
      chartPending.get(url).then(go);
      setTimeout(go, 3000);
    }else{
      playElement(url, 1, c.dataset.k);
    }
    /* 保險：只有真的「開始播」之後才計時；播完由 ended 接手。

    const started = Date.now();
    chartSeq.timer = setInterval(()=>{
      if(!chartSeq) return;
      if(!player.paused && player.currentTime > 0.02 && !player.ended){
        // 正在播：只要沒超過 6 秒就不理它

     改為全部由記憶體 blob 播放，就唔會漏。 */
  const chartBlobs = new Map();            // url -> blob: URL
  const chartPending = new Map();          // url -> Promise（仲抓緊）
  let chartPrefetched = false;
  function prefetchChartAudio(){
    if(chartPrefetched) return;
    chartPrefetched = true;
    const files = [...new Set([...chartBody.querySelectorAll('.kcell[data-k]')]
      .map(c => VOICE_DIR[voiceMode] + chartCellAudio(c.dataset.k)))];
    let i = 0;
    const run = ()=>{
      if(i >= files.length) return;
      const url = files[i++];
      if(chartBlobs.has(url)){ setTimeout(run, 0); return; }
      const pr = fetch(url)
        .then(r => r.ok ? r.blob() : Promise.reject())
        .then(b => { const u = URL.createObjectURL(b); chartBlobs.set(url, u); return u; })
        .catch(()=>null)
        .then(v => { chartPending.delete(url); setTimeout(run, 20); return v; });
      chartPending.set(url, pr);
    };
    run(); run(); run(); run(); run(); run();   // 六條並行，其餘排隊
  }

  function openChart(){
    stopAudioNow();                          // 入假名表即停聲
    buildChart();
    applyChartScript();
    prefetchChartAudio();
    chartEl.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeChart(){
    stopChartSeq();
    chartEl.hidden = true;
    document.body.style.overflow = '';
    chartBody.querySelectorAll('.kcell.playing').forEach(b=>b.classList.remove('playing'));
  }
  chartBtn.addEventListener('click', openChart);
  chartClose.addEventListener('click', closeChart);
  chartBg.addEventListener('click', closeChart);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !chartEl.hidden) closeChart(); });
  chartBody.addEventListener('click', e=>{
    const c = e.target.closest('.kcell'); if(!c || !c.dataset.k) return;
    /* 藍框改為「記住揀咗邊個字」：一直亮住直到揀另一個字或關閉假名表。
       之前是閃 500ms，連按同一個字時上一個 timer 會提早清掉，看起來就像「有時有、有時無」。 */
    stopChartSeq();                          // 手動揀字即停止自動播放
    chartBody.querySelectorAll('.kcell.playing').forEach(b=>b.classList.remove('playing'));
    c.classList.add('playing');
    /* 表上「を」要讀 wo（歷史讀音）；句子／練習裡的助詞 を 仍然讀 o，用另一個檔。 */
    speak(c.dataset.k, undefined, true, c.dataset.k === 'を' ? 'wo-chart' : null);
  });

  /* 已併入日語階梯：Service Worker 交由上層（本站根目錄）統一處理，
     這裡不再註冊 /kana/sw.js，避免兩個 SW 爭同一個 scope。 */
  /* 自動測試用掛鈎：只在 ?kdebug=1 時存在，正常使用不受影響。
     用來驗證「手寫要分平／片假名」這類無法靠點擊重現的判斷。 */
  if(location.search.indexOf('kdebug=1') >= 0){
    window.__kanaTest = {
      all: ()=>[...ALL_KANA.values()],
      setCurrent: o=>{ mode='write'; document.body.classList.add('m-write'); current=o; answered=false; },
      pick: ch=>checkPicked(ch),
      pool: ()=>pool.map(o=>o.k),
      extras: ()=>extrasOn.slice(),
      seq: ()=>chartSeq ? {i:chartSeq.i, n:chartSeq.cells.length, paused:player.paused, t:Math.round(player.currentTime*100)/100, src:(player.currentSrc||'').slice(-20)} : null,
      stats: ()=>({correct:stats.correct, wrong:stats.wrong}),
      answered: ()=>answered
    };
  }

  if(false && 'serviceWorker' in navigator && location.protocol.startsWith('http') && !isNativeApp){
    window.addEventListener('load', async ()=>{
      const had = !!navigator.serviceWorker.controller;
      try{
        const reg = await navigator.serviceWorker.register('sw.js', {updateViaCache:'none'});
        reg.update().catch(()=>{});
        if(had){
          navigator.serviceWorker.addEventListener('controllerchange', ()=>{
            if(location.__reloaded) return;
            location.__reloaded = true;
            location.reload();          // 有新版本接手 → 即時換新版
          });
        }
      }catch(e){}
    });
  }
})();
</script>
</body>
</html>
