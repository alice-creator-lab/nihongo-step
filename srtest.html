<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>語音辨識診斷 2</title>
<style>
  body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:#f7f4ec;color:#2b2620;margin:0;padding:20px;line-height:1.6}
  h1{font-size:18px;margin:0 0 4px}
  p.note{font-size:13px;color:#7a7266;margin:0 0 14px}
  .env{font-size:11px;color:#7a7266;word-break:break-all;margin-bottom:14px}
  .card{background:#fff;border:1px solid #e2dbcd;border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 8px}
  button{font:inherit;font-size:15px;padding:12px 18px;border-radius:12px;border:1px solid #cbbf9f;background:#fbf8f1;width:100%}
  .out{margin-top:10px;font-size:13px;white-space:pre-wrap;word-break:break-all;color:#4a4438}
  .ok{color:#1f7a3d}.bad{color:#a33}
</style>
</head>
<body>
<h1>語音辨識診斷 2（根目錄）</h1>
<p class="note">按 A → B → C，每個讀一個字（例：あ），最後截圖。</p>
<div class="env" id="env">載入中…</div>

<div class="card"><h2>A：lang = ja-JP</h2><button data-v="a">A 開始</button><div class="out" id="out-a">未試</div></div>
<div class="card"><h2>B：lang = ja</h2><button data-v="b">B 開始</button><div class="out" id="out-b">未試</div></div>
<div class="card"><h2>C：lang = en-US</h2><button data-v="c">C 開始</button><div class="out" id="out-c">未試</div></div>
<div class="card"><h2>D：先播一段音檔（開住音訊），播完即刻辨識</h2><button data-v="d">D 開始</button><div class="out" id="out-d">未試</div></div>
<div class="card"><h2>E：先播一段音檔，播住就按辨識（唔停聲）</h2><button data-v="e">E 開始</button><div class="out" id="out-e">未試</div></div>
<audio id="probe" preload="auto" src="kana/audio/n/a.mp3"></audio>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
document.getElementById('env').textContent =
  '網址：' + location.pathname + '\n有 API：' + !!SR +
  '\nSW 控制：' + (navigator.serviceWorker && navigator.serviceWorker.controller ? '有' : '冇');
function log(k, s, cls){
  const el = document.getElementById('out-'+k);
  el.textContent = s; el.className = 'out ' + (cls||'');
}
const LANGS = { a:'ja-JP', b:'ja', c:'en-US' };
function run(k){
  if(!SR){ log(k, '冇 SpeechRecognition API', 'bad'); return; }
  log(k, '啟動中…');
  const evs = [];
  const rec = new SR();
  rec.lang = LANGS[k];
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.continuous = false;
  rec.onstart = ()=>evs.push('start');
  rec.onresult = ev=>{
    const r = ev.results[0], a = [];
    for(let i=0;i<r.length;i++) a.push(r[i].transcript);
    evs.push('result');
    log(k, '成功（' + LANGS[k] + '）：' + a.join(' / ') + '\n事件：' + evs.join(' · '), 'ok');
  };
  rec.onerror = ev=>{ evs.push('error:'+ev.error); log(k, '錯誤（' + LANGS[k] + '）：' + ev.error + '\n事件：' + evs.join(' · '), 'bad'); };
  rec.onend = ()=>{ evs.push('end'); setTimeout(()=>{ const el=document.getElementById('out-'+k); if(!/成功|錯誤/.test(el.textContent)) log(k, '結束但冇結果\n事件：' + evs.join(' · ')); }, 60); };
  try{ rec.start(); }catch(e){ log(k, 'start() 失敗：' + e.message, 'bad'); return; }
  setTimeout(()=>{ try{ rec.stop(); }catch(e){} }, 9000);
}
const probe = document.getElementById('probe');
document.querySelectorAll('button[data-v]').forEach(b=>b.addEventListener('click', ()=>{
  const v = b.dataset.v;
  if(v==='d'){
    const el = document.getElementById('out-d');
    el.textContent = '播放測試音…'; el.className = 'out';
    probe.currentTime = 0;
    probe.onended = ()=>{ probe.onended = null; run('d'); };
    probe.play().catch(e=>{ el.textContent = '播放失敗：' + e.message; el.className='out bad'; });
    return;
  }
  if(v==='e'){
    probe.currentTime = 0;
    probe.play().catch(()=>{});
    setTimeout(()=>run('e'), 150);
    return;
  }
  run(v);
}));
</script>
</body>
</html>
