<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>手機內語音辨識測試 · 日語階梯</title>
<meta name="theme-color" content="#f6f2ea" />
<style>
  :root{--paper:#f6f2ea;--card:#fffdf8;--ink:#221e19;--ink2:#5d5549;--muted:#98907f;--line:#e5dccb;--shu:#b03a2e;
    --sans:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans CJK TC",sans-serif;--serif:"Hiragino Mincho ProN","Songti TC",serif}
  *{box-sizing:border-box}
  body{margin:0 auto;max-width:640px;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
    background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{margin:0 0 14px;font-size:13px;color:var(--ink2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
  .card h2{font-size:13px;margin:0 0 6px;color:var(--ink2);font-weight:500}
  .big{font-family:var(--serif);font-size:19px;line-height:1.6}
  .kana{font-size:12.5px;color:var(--muted)}
  .stage{font-size:15px;font-weight:500}
  .meter{height:6px;background:#ece3d2;border-radius:99px;overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;width:0;background:var(--shu);transition:width .3s}
  button{appearance:none;border:0;border-radius:999px;font-family:var(--sans);font-size:15px;padding:13px 22px;
    background:var(--shu);color:#fffdf8;width:100%;margin-bottom:9px}
  button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  button[disabled]{opacity:.45}
  pre{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px;
    white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;margin:0;max-height:260px;overflow:auto}
  .bad{color:var(--shu)}.ok{color:#3f7a4f}
  .hint{font-size:12px;color:var(--muted);line-height:1.8;margin:10px 0 0}
</style>
</head>
<body>
<h1>手機內語音辨識測試</h1>
<p class="sub">模型在手機瀏覽器內執行，音訊不會上傳。第一次需下載約 47MB。</p>

<div class="card">
  <h2>現在這一步</h2>
  <div class="stage" id="stage">尚未開始</div>
  <div class="meter"><i id="bar"></i></div>
  <div class="kana" id="sub">按下方按鈕開始</div>
</div>

<div class="card">
  <h2>本句</h2>
  <div class="big" id="targetJa">載入中…</div>
  <div class="kana" id="targetKana"></div>
</div>

<button id="load">載入模型</button>
<button id="mic" class="sec" disabled>開始收音（載入後可用）</button>
<button id="stop" class="sec" disabled>停止收音</button>

<div class="card">
  <h2>辨識結果</h2>
  <div class="big" id="said">（未收音）</div>
  <div class="kana" id="score"></div>
</div>

<div class="card">
  <h2>記錄</h2>
  <pre id="log"></pre>
</div>

<p class="hint">
用 Safari 直接開啟（不要用加到主畫面的 App），並先關閉其他分頁。若「現在這一步」停在某一句超過 60 秒，請把該句與下方記錄整段貼回。
</p>

<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<script>
(function(){
  'use strict';
  var el = {
    stage: document.getElementById('stage'),
    sub: document.getElementById('sub'),
    bar: document.getElementById('bar'),
    log: document.getElementById('log'),
    said: document.getElementById('said'),
    score: document.getElementById('score'),
    load: document.getElementById('load'),
    mic: document.getElementById('mic'),
    stop: document.getElementById('stop')
  };
  var lines = [], T0 = performance.now();
  function now(){ return ((performance.now() - T0) / 1000).toFixed(1) + 's'; }
  function log(s, cls){
    lines.push('[' + now() + '] ' + s);
    el.log.innerHTML = lines.slice(-40).map(function(l){
      var c = cls || (/失敗|錯誤|error/.test(l) ? 'bad' : /✓|完成|就緒/.test(l) ? 'ok' : '');
      return '<span class="' + c + '">' + l.replace(/[<>&]/g, function(x){
        return {'<':'&lt;','>':'&gt;','&':'&amp;'}[x];
      }) + '</span>';
    }).join('\n');
    el.log.scrollTop = el.log.scrollHeight;
  }
  function stage(text, sub, pct){
    el.stage.textContent = text;
    if (sub !== undefined && sub !== null) el.sub.textContent = sub;
    if (pct !== undefined) el.bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }

  var qs = new URLSearchParams(location.search);
  var DI = parseInt(qs.get('d') || '0', 10), LI = parseInt(qs.get('l') || '0', 10);
  var target = { ja:'あのう、初めまして。李です。', kana:'あのう、はじめまして。りです。' };
  document.getElementById('targetJa').textContent = target.ja;

  function toHira(s){ return String(s).replace(/[\u30a1-\u30f6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); }); }
  function clean(s){ return toHira(s || '').replace(/[\s\u3000]/g,'').replace(/[、。，．,.！!？?「」『』（）()・…~～ー―-]/g,''); }
  function lcs(a, b){
    var dp = [], i, j;
    for (i = 0; i <= a.length; i++) dp.push(new Array(b.length + 1).fill(0));
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++){
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
    return dp;
  }
  function score(t, heard){
    var a = clean(t).split(''), b = clean(heard).split('');
    if (!a.length || !b.length) return 0;
    return Math.round(lcs(a, b)[a.length][b.length] / a.length * 100);
  }

  fetch('data/lesson-L01.json').then(function(r){ return r.json(); }).then(function(l){
    var line = l.dialogues[DI].lines[LI];
    target = { ja: line.ja, kana: line.kana || line.ja };
    document.getElementById('targetJa').textContent = line.ja;
    document.getElementById('targetKana').textContent = line.kana || '';
    if (el.stage.textContent === '尚未開始') el.sub.textContent = '按下方按鈕開始';
  }).catch(function(){});

  /* 讓畫面保持更新，避免看來像「停住」 */
  var tick = setInterval(function(){
    if (el.stage.textContent.indexOf('收音中') === 0) el.sub.textContent = '已收音 ' + now();
  }, 3000);
  window.addEventListener('pagehide', function(){ clearInterval(tick); });

  var modelBytes = null, model = null;
  var audioContext = null, stream = null, node = null, recognizer = null, running = false, tSpeak = 0;

  function fetchModel(){
    var t = performance.now();
    stage('下載模型', '0.0 MB', 0);
    log('開始下載 models/vosk-ja.tar.gz');
    return fetch('models/vosk-ja.tar.gz').then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var total = parseInt(res.headers.get('content-length') || '0', 10);
      var reader = res.body.getReader();
      var chunks = [], got = 0;
      function pump(){
        return reader.read().then(function(r){
          if (r.done){
            modelBytes = new Blob(chunks);
            log('✓ 下載完成：' + (modelBytes.size / 1048576).toFixed(1) + ' MB，用時 ' + Math.round(performance.now() - t) + ' ms');
            return;
          }
          chunks.push(r.value);
          got += r.value.length;
          var mb = got / 1048576;
          stage('下載模型', mb.toFixed(1) + ' / ' + (total ? (total / 1048576).toFixed(1) : '?') + ' MB',
                total ? got / total * 100 : 0);
          return pump();
        });
      }
      return pump();
    });
  }

  el.load.addEventListener('click', function(){
    var btn = this;
    btn.disabled = true;
    if (!window.Vosk){
      stage('失敗', 'Vosk 函式庫沒有載入（可能被封鎖或離線）', 0);
      log('失敗：window.Vosk 為 ' + typeof window.Vosk);
      btn.disabled = false;
      return;
    }
    log('Vosk 已載入，版本 ' + (window.Vosk.version || 'unknown'));
    stage('準備下載', '正在取得模型檔…', 0);

    fetchModel().then(function(){
      stage('解壓與載入', '在背景執行緒處理，可能要幾十秒', 100);
      log('交給 Vosk 解壓：' + (modelBytes.size / 1048576).toFixed(1) + ' MB');
      var t = performance.now();
      return Vosk.createModel(URL.createObjectURL(modelBytes)).then(function(m){
        model = m;
        log('✓ 模型就緒，用時 ' + Math.round(performance.now() - t) + ' ms');
        stage('模型已就緒', '可以開始收音', 100);
        el.mic.disabled = false;
        btn.textContent = '模型已載入';
      });
    }).catch(function(e){
      log('失敗：' + (e && (e.name || e.message) ? (e.name || '') + ' ' + (e.message || e) : e));
      stage('失敗', '看下方記錄最後一行', 0);
      btn.disabled = false;
    });
  });

  el.mic.addEventListener('click', function(){
    if (!model){ log('失敗：模型未就緒'); return; }
    this.disabled = true;
    stage('要求麥克風', '', 100);
    navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, channelCount:1, sampleRate:16000 } })
      .then(function(s){
        stream = s;
        log('✓ 麥克風已取得');
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        log('音訊取樣率：' + audioContext.sampleRate + ' Hz');
        recognizer = new model.KaldiRecognizer(audioContext.sampleRate);
        recognizer.on('result', function(m){
          var text = (m && m.result && m.result.text) || '';
          log('辨識完成（' + Math.round(performance.now() - tSpeak) + ' ms）：' + text);
          showResult(text);
          cleanupMic();
          stage('已完成', '按「開始收音」再試一次', 100);
        });
        recognizer.on('partialresult', function(m){
          var p = (m && m.result && m.result.partial) || '';
          if (p) el.said.textContent = p + '…';
        });
        node = audioContext.createScriptProcessor(4096, 1, 1);
        node.onaudioprocess = function(ev){
          if (!running) return;
          try { recognizer.acceptWaveform(ev.inputBuffer); }
          catch(e){ log('失敗：acceptWaveform — ' + e); running = false; }
        };
        audioContext.createMediaStreamSource(stream).connect(node);
        node.connect(audioContext.destination);

        running = true;
        tSpeak = performance.now();
        stage('收音中', '請照上面的句子唸一次，然後按「停止收音」', 100);
        log('開始收音');
        el.stop.disabled = false;
        el.said.textContent = '（收音中…）';
      })
      .catch(function(e){
        log('失敗：麥克風 — ' + e.name + ' ' + (e.message || ''));
        stage('麥克風失敗', e.name, 100);
        el.mic.disabled = false;
      });
  });

  el.stop.addEventListener('click', function(){
    this.disabled = true;
    running = false;
    log('停止收音，等待辨識結果');
    stage('辨識中', '正在處理這段錄音…', 100);
    try { recognizer.retrieveFinalResult(); } catch(e){ log('取最終結果失敗：' + e); }
  });

  function cleanupMic(){
    running = false;
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if (node){ try { node.disconnect(); } catch(e){} node = null; }
    if (audioContext && audioContext.state !== 'closed'){ try { audioContext.close(); } catch(e){} }
    audioContext = null;
    el.stop.disabled = true;
    el.mic.disabled = false;
  }

  function showResult(text){
    el.said.textContent = text || '（沒有辨識到內容）';
    el.score.textContent = '與本句比對：' + score(target.kana, text) + ' 分（假名對上的比例）';
  }
})();
</script>
</body>
</html>
