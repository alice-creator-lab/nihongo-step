<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>聲音清單 · 日語階梯</title>
<meta name="theme-color" content="#f6f2ea" />
<style>
  :root{--paper:#f6f2ea;--card:#fffdf8;--ink:#221e19;--ink2:#5d5549;--muted:#98907f;--line:#e5dccb;--shu:#b03a2e;
    --sans:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans CJK TC",sans-serif}
  *{box-sizing:border-box}
  body{margin:0 auto;max-width:640px;padding:18px 16px 40px;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.7}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{margin:0 0 14px;font-size:13px;color:var(--ink2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .v{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .v:last-child{border-bottom:0}
  .v .n{flex:1;min-width:0}
  .v .n b{display:block;font-weight:500;font-size:14.5px}
  .v .n span{font-size:12px;color:var(--muted)}
  .v button{appearance:none;border:1px solid var(--line);background:#fffdf8;color:var(--ink);border-radius:999px;
    font-size:13px;padding:7px 14px;font-family:var(--sans);white-space:nowrap}
  .v button.on{background:var(--shu);border-color:var(--shu);color:#fffdf8}
  .note{font-size:12px;color:var(--muted);line-height:1.8}
  .big{font-size:17px;font-family:"Hiragino Mincho ProN",serif}
</style>
</head>
<body>
<h1>聲音清單</h1>
<p class="sub">這一頁列出你的裝置實際可用的人聲，並可逐一試聽。示範句：</p>
<div class="card"><div class="big">あのう、はじめまして。李です。</div>
  <div class="note">應讀作「あのう、はじめまして。りです。」</div></div>
<button id="sysbtn" style="appearance:none;border:0;background:var(--shu);color:#fffdf8;border-radius:999px;
  font-size:15px;padding:12px 20px;width:100%;margin-bottom:12px;font-family:var(--sans)">試聽：不指定聲音（系統預設）</button>
<div id="list"></div>
<p class="note" id="summary"></p>
<p class="note">判斷是否增強版要看 voiceURI（例如 com.apple.voice.enhanced.ja-JP.Kyoko），因為 iOS 的名字一樣寫「Kyoko」。
若清單內全部都不是增強版，App 不會指定人聲，會沿用你在 設定 → 輔助使用 → 語音內容 → 聲音 → 日文 所選的那一個。</p>

<script>
(function(){
  var TEXT = 'あのう、はじめまして。りです。';
  var list = document.getElementById('list');
  var summary = document.getElementById('summary');

  /* 與 App 相同的判斷：名字＋voiceURI 一併看，iOS 的增強版差別在 voiceURI */
  function tag(v){ return (v.name || '') + ' ' + (v.voiceURI || ''); }
  function enhanced(v){ return /enhanced|premium|neural|siri/i.test(tag(v)); }
  function rankName(v){
    var n = tag(v), s = 0;
    if (/enhanced/i.test(n)) s += 60;
    if (/premium|neural|siri/i.test(n)) s += 50;
    if (/Kyoko|O-ren|Oren|Hattori|Otoya/i.test(n)) s += 20;
    if (/JP/i.test(v.lang)) s += 3;
    if (!v.localService) s += 1;
    return s;
  }

  function render(){
    var all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    var ja = all.filter(function(v){ return /^ja/i.test(v.lang); });
    var best = ja.slice().sort(function(a, b){ return rankName(b) - rankName(a); })[0];
    summary.textContent = '全部聲音 ' + all.length + ' 個；日語 ' + ja.length + ' 個。'
      + (ja.some(enhanced) ? '清單內有增強人聲。' : '清單內沒有增強人聲。')
      + (best ? '　App 會使用：' + best.name + (enhanced(best) ? '（增強）' : '（非增強 → 交回系統預設）') : '');
    if (!ja.length){ list.innerHTML = '<div class="card note">目前沒有日語聲音。</div>'; return; }
    list.innerHTML = '<div class="card">' + ja.map(function(v, i){
      return '<div class="v"><div class="n"><b>' + v.name + (enhanced(v) ? '（增強）' : '') + '</b>' +
        '<span>' + v.lang + ' · ' + (v.localService ? '本機' : '線上') + (v.default ? ' · 預設' : '') + '</span>' +
        '<span style="display:block;word-break:break-all;font-size:11px;color:var(--line)">' + (v.voiceURI || '') + '</span></div>' +
        '<button data-i="' + i + '">試聽</button></div>';
    }).join('') + '</div>';
    Array.prototype.forEach.call(list.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){
        speak(ja[+b.getAttribute('data-i')]);
      });
    });
  }

  function speak(voice){
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(TEXT);
    u.lang = 'ja-JP';
    if (voice) u.voice = voice;
    u.rate = 0.95; u.pitch = 1;
    speechSynthesis.speak(u);
  }

  document.getElementById('sysbtn').addEventListener('click', function(){ speak(null); });
  render();
  speechSynthesis.onvoiceschanged = render;
  document.addEventListener('pointerdown', render, { once:true });
})();
</script>
</body>
</html>
